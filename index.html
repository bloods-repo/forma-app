:root{color-scheme:light dark;--bg:light-dark(#fbf8f5,#15111d);--card:light-dark(#fff,#1f1a2b);--ink:light-dark(#1b1624,#f3eff8);--mut:light-dark(#6c6478,#a69db3);--line:light-dark(#ebe4dc,#2f2840);--red:#f04e23;--plum:#2b2140;--lime:#c6f432;--limeInk:#1b2400}

.ring{position:relative;width:clamp(150px,30vw,200px);aspect-ratio:1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .num{font-size:clamp(34px,7vw,48px);font-weight:800;line-height:1}
.ring small{color:#cfc6dd;font-size:13px}

@media(prefers-reduced-motion:reduce){.prog{transition:none}}
.date{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.date h2{font-size:clamp(20px,3.4vw,28px);margin:0;line-height:1.1;font-weight:600}
.ib{border:1px solid #ffffff40;background:none;color:#fff;width:44px;height:44px;border-radius:50%;font-size:20px}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:18px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px}

.it .t small{display:block;color:var(--mut);font-size:13px;line-height:1.35;margin-top:2px}

.mc{background:var(--card);border-radius:22px;padding:22px;max-width:480px;width:100%;max-height:90vh;overflow:auto;position:relative}
.mc .x{position:absolute;top:8px;right:8px}
.steps{padding-left:22px;margin:10px 0 0}.steps li{margin:6px 0}
#wo{background:var(--plum);color:#fff;display:block;overflow:auto;padding:0}
.wo-in{max-width:560px;margin:0 auto;padding:16px 20px 28px;display:flex;flex-direction:column;min-height:100%}
.wtop{display:flex;justify-content:space-between;align-items:center}
#wob{display:flex;flex-direction:column;flex:1}
.wbar{height:6px;background:#ffffff22;border-radius:3px;overflow:hidden;margin:8px 0 10px}.wbar i{display:block;height:100%;background:var(--lime)}

.rate{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:20px}.rate button{min-height:72px;border-radius:16px;border:0;font-weight:700;font-size:16px;background:#ffffff18;color:#fff}.rate button:hover,.rate button:focus-visible{background:var(--lime);color:var(--limeInk)}

.bd{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:14px}
.bd div{text-align:center;font-size:13px;color:var(--mut);line-height:1.35}.bd b{display:block;color:var(--ink);font-size:14px}

.pic .fl{opacity:.38}.pic .hd{fill:currentColor}.pic .pr{stroke-width:3;opacity:.45}.pic .fr{stroke-width:2;opacity:.3}.pic .ar{stroke:var(--red);stroke-width:3}

main{padding:18px max(4vw,14px) calc(120px + env(safe-area-inset-bottom))}

.bnav button.on{color:var(--red);background:color-mix(in srgb,var(--red) 14%,transparent)}.bnav button.on svg{transform:translateY(-1px) scale(1.1)}
.toast{bottom:calc(92px + env(safe-area-inset-bottom));border-radius:16px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:80;overflow:hidden}
.cf{position:absolute;width:8px;height:8px;border-radius:2px}.cf2{width:8px;height:13px}
.fxt{position:absolute;font:800 15px Unbounded,sans-serif;color:var(--red);white-space:nowrap;text-shadow:0 2px 8px var(--card)}.fxt.neg{color:var(--mut)}
.enter{animation:pg .34s cubic-bezier(.2,.7,.3,1)}@keyframes pg{from{opacity:0;transform:translateY(12px)}}
.enter>.card,.enter>.grid>.card{animation:pg .4s cubic-bezier(.2,.7,.3,1) backwards}
.enter>.card:nth-child(2),.enter>.grid>.card:nth-child(2){animation-delay:.04s}.enter>.card:nth-child(3),.enter>.grid>.card:nth-child(3){animation-delay:.08s}.enter>.card:nth-child(n+4),.enter>.grid>.card:nth-child(n+4){animation-delay:.12s}
@media(prefers-reduced-motion:reduce){.enter,.enter>.card,.enter>.grid>.card{animation:none}.btn,.box,.bnav svg{transition:none}}
@media(min-width:900px){.bnav{bottom:18px}}
.upd{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));z-index:61;display:flex;gap:12px;align-items:center;background:var(--ink);color:var(--bg);padding:8px 8px 8px 16px;border-radius:16px;box-shadow:0 10px 30px #0005;white-space:nowrap}.upd .btn{min-height:40px}
@media(max-width:600px){.hero{grid-template-columns:minmax(0,1fr);justify-items:center;text-align:center}.date{justify-content:center}.week{margin:0 auto}}
</style>
</head>
<body>
<header class="top">
  <div class="bar"><h1>Форма<b>.</b>дома</h1><div class="lv" id="lv"></div></div>
</header>
<main>
  <section class="hero" id="hero">
    <div class="ring">
      <svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="#ffffff1f" stroke-width="12"/><circle class="prog" id="prog" cx="60" cy="60" r="52" fill="none" stroke="#c6f432" stroke-width="12" stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="326.7"/></svg>
      <div class="c"><span class="num" id="pct">0%</span><small id="cnt">0 из 0</small></div>
    </div>
    <div>
      <div class="date"><button class="ib" id="prev" aria-label="Предыдущий день">‹</button><h2 id="dt"></h2><button class="ib" id="next" aria-label="Следующий день">›</button><button class="tdy" id="tdy" hidden>К сегодня</button></div>
      <p class="sub" id="dsub"></p>
      <div class="week" id="week"></div>
      <p class="save" id="save"></p>
    </div>
  </section>
  <section id="v-today" class="grid"></section>
  <section id="v-plan" hidden></section>
  <section id="v-food" hidden></section>
  <section id="v-hist" hidden></section>
  <section id="v-me" hidden></section>
</main>
<nav class="bnav" aria-label="Разделы">
  <button data-v="today"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M8.3 12.3l2.5 2.4 4.9-5.2"/></svg>Сегодня</button>
  <button data-v="plan"><svg viewBox="0 0 24 24"><path d="M6.5 7v10M17.5 7v10M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/></svg>Тренировки</button>
  <button data-v="food"><svg viewBox="0 0 24 24"><path d="M3.5 11.5h17a8.5 8 0 0 1-17 0z"/><path d="M9 4.5c-1 1 1 2 0 3.5M13 4.5c-1 1 1 2 0 3.5"/></svg>Питание</button>
  <button data-v="hist"><svg viewBox="0 0 24 24"><path d="M4 20h16M7 16.5v-4M12 16.5V7.5M17 16.5V10"/></svg>Прогресс</button>
  <button data-v="me"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4.5 20c1.4-3.6 4.3-5.5 7.5-5.5s6.1 1.9 7.5 5.5"/></svg>Профиль</button>
</nav>
<div id="wo" class="ov" hidden role="dialog" aria-modal="true" aria-label="Тренировка"><div class="wo-in"><div class="wtop"><b>Тренировка</b><button class="ib" data-wa="close" aria-label="Закрыть">×</button></div><div id="wob"></div></div></div>
<div id="modal" class="ov" hidden><div class="mc" role="dialog" aria-modal="true"><button class="del x" data-close aria-label="Закрыть">×</button><div id="mbody"></div></div></div>
<div id="toast" class="toast" hidden role="status"></div>

<script>
{
const DN=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
const DL=['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
const MN=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
let uid=0;const nid=()=>Date.now().toString(36)+(uid++);
const X=(n,d,t)=>({id:nid(),n,d,t});
const P=(n,...s)=>({id:nid(),n,s});
const STAGES=['Знакомство','Привыкание','Укрепление','Уверенный старт'];
const tk=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const warm=()=>P('Разминка: суставы + ходьба на месте','5 мин','5 мин','7 мин','7 мин');
const cool=()=>P('Растяжка','5 мин','5 мин','7 мин','10 мин');
const DEF={plan:{ver:2,start:tk(),
  days:{
    1:[warm(),P('Приседания','к стулу · 2×8','к стулу · 2×12','3×12','3×15'),P('Отжимания','от стены · 2×8','от стены · 3×10','от стола · 3×8','с колен · 3×10'),P('Ягодичный мост','2×10','3×10','3×15','3×20'),P('Планка','на коленях · 2×15 с','2×20 с','3×25 с','3×35 с'),cool()],
    2:[P('Быстрая ходьба','20 мин','25 мин','30 мин','35 мин'),P('Растяжка','5 мин','5 мин','10 мин','10 мин')],
    3:[warm(),P('Выпады назад','у опоры · 2×5 на ногу','у опоры · 2×8','3×8','3×10'),P('Отжимания','от стены · 2×8','от стены · 3×10','от стола · 3×8','с колен · 3×10'),P('Птица-собака','2×6 на сторону','2×8','3×8','3×10'),P('Супермен','2×8','2×10','3×10','3×12'),cool()],
    4:[P('Быстрая ходьба','20 мин','25 мин','30 мин','35 мин'),P('Растяжка','5 мин','5 мин','10 мин','10 мин')],
    5:[warm(),P('Приседания','к стулу · 2×8','к стулу · 2×12','3×12','3×15'),P('Подъёмы на носки','2×10','2×15','3×15','3×20'),P('Отжимания','от стены · 2×8','от стены · 3×10','от стола · 3×8','с колен · 3×10'),P('Скручивания лёжа','2×8','2×12','3×12','3×15'),P('Планка','на коленях · 2×15 с','2×20 с','3×25 с','3×35 с'),cool()],
    6:[P('Прогулка','30 мин','35 мин','40 мин','45 мин')],
    0:[]},
  meals:[X('Завтрак','белок + каша'),X('Обед','мясо/рыба + овощи'),X('Перекус','фрукт или йогурт'),X('Ужин','лёгкий, за 3 ч до сна')],
  habits:[X('Без сладкого'),X('Сон 7+ часов'),X('8 000+ шагов')],
  water:8},log:{}};
const migrate=()=>{if(!S.plan||S.plan.ver!==2){S.plan=JSON.parse(JSON.stringify(DEF.plan));S.log=S.log||{}}};

let S=JSON.parse(JSON.stringify(DEF));
const LS='forma-doma-v1';
try{const v=localStorage.getItem(LS);if(v)S=JSON.parse(v)}catch(e){}
migrate();

const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const key=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const parse=k=>{const[a,b,c]=k.split('-').map(Number);return new Date(a,b-1,c)};
const add=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const TODAY=()=>key(new Date());
let cur=TODAY(),view='today',planDay=new Date().getDay();

const DAY=864e5;
const weekOf=k=>Math.max(0,Math.floor((parse(k)-parse(S.plan.start))/DAY/7));
const stageOf=k=>Math.min(3,Math.floor(weekOf(k)/2));
const dose=(e,k)=>e.s?e.s[stageOf(k)]:e.d;
const L=k=>S.log[k]||(S.log[k]={x:{},m:{},h:{},w:0,kg:''});
const Lr=k=>S.log[k]||{x:{},m:{},h:{},w:0,kg:''};
function score(k){
  const l=Lr(k),dw=parse(k).getDay(),ex=S.plan.days[dw]||[];
  let tot=ex.length+S.plan.meals.length+S.plan.habits.length+1,done=0;
  ex.forEach(e=>l.x[e.id]&&done++);S.plan.meals.forEach(e=>l.m[e.id]&&done++);S.plan.habits.forEach(e=>l.h[e.id]&&done++);
  if(l.w>=S.plan.water)done++;
  return{done,tot,p:tot?done/tot:0};
}

/* ---------- эффекты ---------- */
const APPV=14;
const RM=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
const FXC=['#c6f432','#ffd23f','#3aa0e8','#ff7ab6','#ffffff'];
function fxl(){let l=document.getElementById('fx');if(!l){l=document.createElement('div');l.id='fx';document.body.appendChild(l)}return l}
const acc=()=>getComputedStyle(document.documentElement).getPropertyValue('--red').trim()||'#f04e23';
function burst(x,y,n=12,sp=64){if(RM||!Element.prototype.animate)return;const L=fxl(),a0=acc();
  for(let i=0;i<n;i++){const e=document.createElement('i'),a=Math.random()*Math.PI*2,d=sp*(.45+Math.random()*.7);e.className='cf';e.style.cssText=`left:${x}px;top:${y}px;background:${i%3?FXC[i%FXC.length]:a0}`;L.appendChild(e);
    e.animate([{transform:'translate(-50%,-50%)',opacity:1},{transform:`translate(calc(-50% + ${Math.cos(a)*d}px),calc(-50% + ${Math.sin(a)*d}px)) rotate(${Math.random()*300}deg) scale(.5)`,opacity:0}],{duration:520+Math.random()*320,easing:'cubic-bezier(.15,.7,.3,1)'}).onfinish=()=>e.remove()}}
function confetti(){if(RM||!Element.prototype.animate)return;const L=fxl(),a0=acc();
  for(let i=0;i<90;i++){const e=document.createElement('i');e.className='cf cf2';e.style.cssText=`left:${Math.random()*innerWidth}px;top:-16px;background:${i%4?FXC[i%FXC.length]:a0}`;L.appendChild(e);
    e.animate([{transform:'translate(0,0) rotate(0)'},{transform:`translate(${(Math.random()-.5)*180}px,${innerHeight+30}px) rotate(${(Math.random()-.5)*900}deg)`}],{duration:1500+Math.random()*1300,delay:Math.random()*350,easing:'cubic-bezier(.3,.55,.6,1)',fill:'backwards'}).onfinish=()=>e.remove()}}
function floatTxt(x,y,t,neg){if(RM||!Element.prototype.animate)return;const e=document.createElement('b');e.className='fxt'+(neg?' neg':'');e.textContent=t;e.style.cssText=`left:${x}px;top:${y-10}px`;fxl().appendChild(e);
  e.animate([{transform:'translate(-50%,0) scale(.8)',opacity:0},{transform:'translate(-50%,-14px) scale(1)',opacity:1,offset:.2},{transform:'translate(-50%,-50px)',opacity:0}],{duration:1050,easing:'ease-out'}).onfinish=()=>e.remove()}
const buzz=v=>{try{navigator.vibrate&&navigator.vibrate(v)}catch(e){}};
const woAllDone=k=>{const ex=S.plan.days[parse(k).getDay()]||[],l=Lr(k);return ex.length>0&&ex.every(e=>l.x[e.id])};
function fxAct(el,fn){const r=el&&el.getBoundingClientRect?el.getBoundingClientRect():null,x0=xpTotal(),p0=score(cur).p,w0=woAllDone(cur);fn();
  const dx=xpTotal()-x0,p1=score(cur).p,w1=woAllDone(cur);if(r){const cx=r.left+Math.min(r.width/2,70),cy=r.top+r.height/2;
    if(dx>0){floatTxt(cx,cy,'+'+dx+' XP');burst(cx,cy);buzz(10)}else if(dx<0)floatTxt(cx,cy,dx+' XP',true)}
  if(!w0&&w1){confetti();buzz([18,40,18]);toast('Тренировка выполнена!')}else if(p0<1&&p1>=1){confetti();toast('День закрыт на 100%!')}}

/* ---------- сохранение ---------- */
let db=null,ref=null,timer=null;
function touch(){const l=S.log[cur];if(l)l.u=Date.now()}
function persist(){
  S.upd=Date.now();
  try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}
  try{queueSync()}catch(e){}
  if(!ref)return;
  clearTimeout(timer);$('#save').textContent='Сохраняю…';
  timer=setTimeout(async()=>{try{await ref.set({json:JSON.stringify(S)});$('#save').textContent='Сохранено ✓'}catch(e){$('#save').textContent='Сохранено на этом устройстве'}},700);
}
function changed(){touch();checkBadges();checkLevel();persist();render()}

/* ---------- Сегодня ---------- */
function item(kind,e,on,dd,sub){if(dd===undefined)dd=e.d;const info=kind==='x'&&tech(e.n);return `<div class="it${on?' done':''}" role="checkbox" tabindex="0" aria-checked="${!!on}" data-k="${kind}" data-id="${esc(e.id)}"><span class="box"></span><span class="t">${esc(e.n)}${sub?`<small>${esc(sub)}</small>`:''}</span>${dd?`<span class="d">${esc(dd)}</span>`:''}${info?`<button class="qi" data-info="${esc(e.id)}" aria-label="Как делать: ${esc(e.n)}">?</button>`:''}</div>`}
function renderToday(){
  const l=Lr(cur),dw=parse(cur).getDay(),ex=S.plan.days[dw]||[],n=NUT(),sh=mealShares(),sch=SCHED(cur);
  const mt={};sch.forEach(it=>{if(it.kind==='meal')mt[it.id]=hm(it.m)});const wot=sch.find(it=>it.kind==='wo');
  const exDone=ex.filter(e=>l.x[e.id]).length,mDone=S.plan.meals.filter(e=>l.m[e.id]).length,hDone=S.plan.habits.filter(e=>l.h[e.id]).length;
  let w='';for(let i=0;i<S.plan.water;i++)w+=`<button class="${i<l.w?'f':''}" data-w="${i+1}" aria-label="Стакан ${i+1}"></button>`;
  const recDue=cur===TODAY()&&weekOf(TODAY())>=1&&(!lastRec()||lastRec()<key(add(new Date(),-28)));
  $('#v-today').innerHTML=`
  ${!S.prof?`<div class="card hi wide"><h3>Настрой под себя</h3><p style="margin:0 0 12px">Рост, вес, цель и распорядок — посчитаю еду, воду и время.</p><button class="btn" data-v="me">Заполнить профиль</button></div>`:''}
  <div id="nowbar" class="wide"></div>
  ${recDue?`<div class="nb wide"><span>Пора проверить рекорды</span><button class="btn" data-v="hist">Открыть</button></div>`:''}
  <div class="card"><h3>Тренировка <span>${wot?hm(wot.m)+' · ':''}${exDone}/${ex.length}</span></h3>
    ${ex.length?`<button class="btn big" data-wo="1">${exDone===0?'Начать тренировку':exDone===ex.length?'Пройти ещё раз':'Продолжить'}</button>`:''}
    ${ex.length?ex.map(e=>item('x',e,l.x[e.id],dose(e,cur))).join(''):'<p class="rest">День отдыха</p>'}
    ${ex.length?`<div class="row" style="margin-top:10px"><button class="btn ghost" id="allx">${exDone===ex.length?'Снять все':'Отметить всё'}</button>${l.r?`<span class="muted">${['','Легко','Нормально','Тяжело'][l.r]}</span>`:''}</div>`:''}
    ${cur===TODAY()?advHtml():''}
  </div>
  <div class="card"><h3>Питание <span>${mDone}/${S.plan.meals.length}</span></h3>
    ${n?`<p class="muted top0">${fmtN(n.kcal)} ккал · ${n.prot} г белка</p>`:''}
    ${S.plan.meals.map(e=>item('m',e,l.m[e.id],mt[e.id]||'',n?`≈${fmtN(Math.round(n.kcal*sh[e.id]/10)*10)} ккал · ${plate(n,sh[e.id])}`:e.d)).join('')||'<p class="rest">Выбери приёмы пищи в профиле</p>'}
    <h3 class="mt">Вода <span>${l.w}/${S.plan.water}</span></h3>
    <div class="water">${w}</div>
  </div>
  <div class="card"><h3>Распорядок</h3><div id="sched"></div></div>
  ${sleepCard(l)}
  <div class="card"><h3>Привычки <span>${hDone}/${S.plan.habits.length}</span></h3>
    ${S.plan.habits.map(e=>item('h',e,l.h[e.id])).join('')||'<p class="rest">Добавь привычки в профиле</p>'}
    <h3 class="mt">Вес</h3>
    <div class="row"><input type="number" id="kg" inputmode="decimal" step="0.1" placeholder="72.4" value="${esc(l.kg)}" aria-label="Вес в кг"><span class="muted">кг</span></div>
  </div>`;
  renderSched();
}

/* ---------- План ---------- */
function plRows(list,kind){const st=stageOf(TODAY());return list.map((e,i)=>`<div class="pl"><span class="t">${esc(e.n)}${e.s?` <span class="muted">· ${esc(e.s[st])}${st<3?` → потом ${esc(e.s[st+1])}`:''}</span>`:e.d?` <span class="muted">· ${esc(e.d)}</span>`:''}</span><button class="del" data-del="${kind}" data-i="${i}" aria-label="Удалить ${esc(e.n)}">×</button></div>`).join('')}
function renderPlan(){
  const ex=S.plan.days[planDay]||(S.plan.days[planDay]=[]);
  const t=TODAY(),wk=weekOf(t),st=stageOf(t),left=st<3?(st+1)*2-wk:0;
  const tex=S.plan.days[new Date().getDay()]||[],tl=Lr(t),td=tex.filter(e=>tl.x[e.id]).length;
  const lib=Object.keys(TECH).filter(k=>k!=='Прогулка').map(k=>`<details class="lib"><summary>${esc(k)}</summary>${picHtml(k)}<ol class="steps">${TECH[k].map(x=>`<li>${esc(x)}</li>`).join('')}</ol></details>`).join('');
  $('#v-plan').innerHTML=`<h2 class="pt">Тренировки</h2>
  <div class="grid">
  <div class="card"><h3>Сегодня <span>${tex.length?td+'/'+tex.length:'отдых'}</span></h3>
    ${tex.length?`<p class="muted top0">${tex.map(e=>esc(e.n.split(':')[0])).join(' · ')}</p><button class="btn big" data-wo="1" data-today="1">${td===0?'Начать тренировку':td===tex.length?'Пройти ещё раз':'Продолжить'}</button>`:'<p class="rest">День отдыха</p>'}
  </div>
  <div class="card"><h3>Программа <span>неделя ${wk+1} из 8</span></h3>
    <div class="stg">${STAGES.map((n,i)=>`<i class="${i<st?'past':i===st?'on':''}" title="${n}"></i>`).join('')}</div>
    <p style="margin:0"><b>Этап ${st+1} · ${STAGES[st]}</b></p>
    <p class="muted" style="margin:2px 0 0">${wk>=8?'Программа пройдена':st<3?`Дальше «${STAGES[st+1]}» через ${left===1?'неделю':left+' нед.'}`:'Последний этап'}</p>
    <div class="row" style="margin-top:10px"><button class="btn ghost" id="slow">Повторить неделю</button><button class="btn ghost" id="fast">Следующий этап</button><button class="btn ghost" id="restart">Сначала</button></div>${advHtml()}
  </div>
  <div class="card"><h3>План по дням</h3>
    <div class="chips">${[1,2,3,4,5,6,0].map(d=>`<button data-pd="${d}" class="${d===planDay?'on':''}">${DN[d]}</button>`).join('')}</div>
    ${plRows(ex,'x')||'<p class="rest">День отдыха</p>'}
    <form class="row" data-add="x" style="margin-top:10px"><input type="text" name="n" placeholder="Упражнение" required><input type="text" name="d" placeholder="3×12"><button class="btn">Добавить</button></form>
  </div>
  <div class="card"><h3>Как делать</h3>${lib}</div>
  </div>`;
}

/* ---------- История ---------- */
function renderHist(){
  const t=new Date();let streak=0;
  for(let i=0;i<400;i++){const k=key(add(t,-i));const s=score(k);if(s.p>=0.7)streak++;else if(i>0)break;}
  let sum=0,n=0,full=0;for(let i=0;i<30;i++){const s=score(key(add(t,-i)));if(S.log[key(add(t,-i))]){sum+=s.p;n++}if(s.p>=0.999)full++}
  const start=add(t,-34-((t.getDay()+6)%7));let cells=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(d=>`<div class="h">${d}</div>`).join('');
  for(let i=0;i<42;i++){const d=add(start,i);if(d>t)break;const k=key(d),p=S.log[k]?score(k).p:0;

  let v=0;ms.forEach(e=>{v+=sh[e.id]<.15?200:per});v+={no:0,some:150,day:400}[p.jf]||0;
  return{v:Math.round(v/50)*50,src:'оценка по порциям'}}
function NUT(){

  const bmi=w/((h/100)**2),bmr=10*w+6.25*h-5*a+(m?5:-161);
  const tdee=bmr*({sit:1.375,feet:1.55,hard:1.7}[p.act]||1.375);

  const wk=p.at?Math.max(0,Math.floor((parse(TODAY())-parse(p.at))/864e5/7)):0;

}
const SHARE={'Завтрак':.25,'Обед':.35,'Перекус':.1,'Ужин':.3};

function SCHED(k){

  let work=null;if(p.wd!=='none'&&p.ws&&p.we){const a=tm(p.ws);let b=tm(p.we);if(b<=a)b+=1440;work=[a,b]}

      const ta=a>=0?tt[a]:bf,tb=b<ms.length?tt[b]:dinner;t=a>=0&&b<ms.length?(ta+tb)/2:a<0&&b<ms.length?Math.max(wake+30,tb-150):Math.min(sleep-90,ta+150)}return t});
  const notes=[];

    ms.forEach((e,i)=>{if(fixed(i))return;if(!(ft[i]>wo-gap(e)&&ft[i]<wo+dur))return;

/* ---------- таймер тренировки ---------- */
let W=null,wi=null,ac=null,lastS=-1;
const REST=()=>stageOf(cur)<2?60:45;
const fmt=s=>s>=60?Math.floor(s/60)+':'+String(s%60).padStart(2,'0'):String(s);
function beep(f=880,d=.18){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(.3,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.start();o.stop(ac.currentTime+d+.02)}catch(e){}}
function pdose(d){
  d=String(d||'');const pre=d.includes('·')?d.split('·')[0].trim():'',s=d.split('·').pop().trim();
  let m=s.match(/(\d+)\s*×\s*(\d+)\s*(с|мин)?/);
  if(m){const v=+m[2],u=m[3];return{pre,sets:+m[1],reps:u?0:v,sec:u==='с'?v:u==='мин'?v*60:0,note:s.replace(m[0],'').trim()}}
  m=s.match(/(\d+)\s*мин/);if(m)return{pre,sets:1,reps:0,sec:+m[1]*60,note:''};
  return{pre,sets:1,reps:0,sec:0,note:s};
}
function woOpen(){
  const ex=S.plan.days[parse(cur).getDay()]||[];if(!ex.length)return;
  const l=Lr(cur),list=ex.map(e=>Object.assign({e},pdose(dose(e,cur))));
  let i=list.findIndex(x=>!l.x[x.e.id]);if(i<0)i=0;
  W={list,i,s:0,ph:'ready',end:0,pause:0};beep(40,.01);
  try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(w=>{if(W)W.lock=w}).catch(()=>{})}catch(e){}
  $('#wo').hidden=false;document.body.style.overflow='hidden';wi=setInterval(woTick,200);woDraw();
}
function woClose(){clearInterval(wi);try{W&&W.lock&&W.lock.release()}catch(e){}W=null;$('#wo').hidden=true;document.body.style.overflow='';render()}
function woDone(){
  const x=W.list[W.i];
  if(W.s+1<x.sets){W.s++;W.ph='rest';W.end=Date.now()+REST()*1000}
  else{L(cur).x[x.e.id]=1;touch();checkBadges();persist();W.i++;W.s=0;
    if(W.i>=W.list.length){W.ph='rate';beep(660,.15);setTimeout(()=>beep(990,.3),180);confetti()}
    else if(x.sec>=120||x.sets<2)W.ph='ready';
    else{W.ph='rest';W.end=Date.now()+Math.round(REST()*.75)*1000}}
  lastS=-1;woDraw();
}
function woTick(){
  if(!W||W.pause||(W.ph!=='work'&&W.ph!=='rest'))return;
  const left=Math.max(0,W.end-Date.now()),sec=Math.ceil(left/1000),n=$('#woN');if(n)n.textContent=fmt(sec);
  if(sec!==lastS&&sec<=3&&sec>0)beep(520,.1);lastS=sec;
  if(left<=0){beep(990,.35);lastS=-1;if(W.ph==='work')woDone();else{W.ph='ready';woDraw()}}
}
function woDraw(){
  const b=$('#wob');if(!W)return;
  if(W.ph==='rate'){b.innerHTML=`<p class="wl">Тренировка завершена</p><h2 class="wn">Как прошло?</h2><div class="rate"><button data-rate="1">Легко</button><button data-rate="2">Нормально</button><button data-rate="3">Тяжело</button></div><p class="wl" style="margin-top:16px">По оценкам приложение подскажет, когда усложнять, а когда повторить неделю.</p>`;return}
  const x=W.list[W.i],t=tech(x.e.n),tot=W.list.length;
  let mid='',btns='';
  if(W.ph==='rest'){
    mid=`<p class="wl">Отдых</p><div class="wbig" id="woN">${fmt(Math.ceil((W.end-Date.now())/1000))}</div><p class="wl">Дальше: ${esc(x.e.n)}${x.pre?' ('+esc(x.pre)+')':''}${x.sets>1?` · подход ${W.s+1}`:''}</p>`;
    btns=`<button class="btn ghostw" data-wa="plus">+15 с</button><button class="btn" data-wa="skip">Пропустить отдых</button>`;
  }else{
    mid=`<h2 class="wn">${esc(x.e.n)}</h2>${x.pre?`<p class="wl">${esc(x.pre)}</p>`:''}${picHtml(x.e.n)}`;
    if(x.sec){const left=W.ph==='work'?(W.pause?Math.ceil(W.pause/1000):Math.ceil((W.end-Date.now())/1000)):x.sec;
      mid+=`<div class="wbig" id="woN">${fmt(left)}</div>${x.note?`<p class="wl">${esc(x.note)}</p>`:''}`;
      btns=W.ph==='work'?`<button class="btn ghostw" data-wa="pause">${W.pause?'Продолжить':'Пауза'}</button><button class="btn" data-wa="done">Готово</button>`:`<button class="btn" data-wa="go">Старт</button><button class="btn ghostw" data-wa="next">Пропустить</button>`}
    else if(x.reps){mid+=`<div class="wbig">${x.reps}</div><p class="wl">повторов${x.note?' '+esc(x.note):''}</p>`;btns=`<button class="btn" data-wa="done">Сделал подход</button><button class="btn ghostw" data-wa="next">Пропустить</button>`}
    else{mid+=`<p class="wl">${esc(x.note||'Выполни упражнение')}</p>`;btns=`<button class="btn" data-wa="done">Готово</button>`}
    if(t)mid+=`<ul class="wt">${t.slice(0,3).map(s=>`<li>${esc(s)}</li>`).join('')}</ul>`;
  }
  b.innerHTML=`<div class="wbar"><i style="width:${Math.round(W.i/tot*100)}%"></i></div><p class="wl">Упражнение ${W.i+1} из ${tot}${x.sets>1&&W.ph!=='rest'?` · подход ${W.s+1} из ${x.sets}`:''}</p>${mid}<div class="wbtn">${btns}</div>`;
}

/* ---------- оценка и советы ---------- */
function advice(){
  const from=key(add(new Date(),-14)),after=S.plan.advAt||'';
  const r=Object.keys(S.log).filter(k=>S.log[k].r&&k>=from&&k>after).sort().reverse().slice(0,3).map(k=>S.log[k].r);
  if(r.length>=2&&r.filter(v=>v===1).length>=2&&stageOf(TODAY())<3)return{t:'fast',m:'Последние тренировки даются легко — можно перейти на следующий этап.'};
  if(r.length>=2&&r.filter(v=>v===3).length>=2&&weekOf(TODAY())>0)return{t:'slow',m:'Последние тренировки были тяжёлыми — лучше повторить неделю. Это нормально.'};
  return null;
}
const advHtml=()=>{const a=advice();return a?`<div class="nb">${a.m} <button class="btn" data-sh="${a.t}">${a.t==='fast'?'Перейти на этап':'Повторить неделю'}</button></div>`:''};
function shift(t){const s0=parse(S.plan.start),w=weekOf(TODAY());
  if(t==='slow')S.plan.start=key(add(s0,7));else if(t==='fast')S.plan.start=key(add(s0,-((Math.min(3,Math.floor(w/2))+1)*2-w)*7));else S.plan.start=TODAY();
  S.plan.advAt=TODAY();changed();toast(t==='slow'?'Неделя повторяется — нагрузка чуть ниже.':t==='fast'?'Новый этап: «'+STAGES[stageOf(TODAY())]+'»':'Программа началась заново.')}

const BADGES=[
 ['wo1','Первый шаг','Первая выполненная тренировка','1'],['wo10','Десятка','10 тренировок','10'],['wo25','25 тренировок','Полностью выполненных','25'],['wo50','Полсотни','50 тренировок','50'],

 ['week','Полная неделя','Все силовые за неделю','Н'],['water7','Водный баланс','Норма воды 7 дней подряд','H₂O'],
 ['st2','Этап 2','Дошёл до «Привыкания»','II'],['st4','Финишная прямая','Дошёл до «Уверенного старта»','IV'],['kg1','Первый килограмм','Вес сдвинулся на 1 кг к цели','1кг']];
function earned(){
  const ks=Object.keys(S.log).sort(),got=new Set(),weeks={};let wo=0,run=0,p7=null,best=0,wr=0,pw=null,wb=0;
  const strongN=Object.values(S.plan.days).filter(a=>a.length>2).length;
  for(const k of ks){const l=S.log[k],dw=parse(k).getDay(),ex=S.plan.days[dw]||[],done=ex.length>0&&ex.every(e=>l.x[e.id]);
    if(done)wo++;
    if(done&&ex.length>2){const mon=key(add(parse(k),-((dw+6)%7)));weeks[mon]=(weeks[mon]||0)+1}
    if(score(k).p>=.7){run=p7&&key(add(parse(p7),1))===k?run+1:1;p7=k;best=Math.max(best,run)}
    if(l.w>=S.plan.water){wr=pw&&key(add(parse(pw),1))===k?wr+1:1;pw=k;wb=Math.max(wb,wr)}}
  [[1,'wo1'],[10,'wo10'],[25,'wo25'],[50,'wo50']].forEach(([n,id])=>{if(wo>=n)got.add(id)});
  [[3,'s3'],[7,'s7'],[30,'s30'],[100,'s100']].forEach(([n,id])=>{if(best>=n)got.add(id)});
  if(strongN&&Object.values(weeks).some(v=>v>=strongN))got.add('week');
  if(wb>=7)got.add('water7');
  const st=stageOf(TODAY());if(st>=1)got.add('st2');if(st>=3)got.add('st4');
  const kg=ks.map(k=>parseFloat(S.log[k].kg)).filter(v=>v>0);
  if(kg.length>1&&S.prof){const d=kg[kg.length-1]-kg[0];if((S.prof.goal==='lose'&&d<=-1)||(S.prof.goal==='gain'&&d>=1))got.add('kg1')}
  return got;
}
function checkBadges(silent){const old=S.badges||{},nb={},nw=[];S.seenB=S.seenB||{};
  earned().forEach(id=>{nb[id]=old[id]||TODAY();if(!S.seenB[id]){S.seenB[id]=1;nw.push(id)}});S.badges=nb;

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-info],[data-wo],[data-wa],[data-rate],[data-sh],[data-close],#modal');if(!t)return;

/* ---------- сон и шаги ---------- */
const slH=sl=>sl&&sl.b&&sl.w?((tm(sl.w)-tm(sl.b)+1440)%1440)/60:null;
const fmtH=h=>Math.floor(h)+' ч'+(Math.round(h%1*60)?' '+Math.round(h%1*60)+' мин':'');
const stepsGoal=()=>(S.prof&&+S.prof.steps)||8000;
function autoHabit(k){const l=L(k),hs=S.plan.habits;
  const sh=hs.find(h=>/сон/i.test(h.n)),h=slH(l.sl);
  if(sh&&h!=null){const m=sh.n.match(/(\d+)/),need=m?+m[1]:7;if(h>=need)l.h[sh.id]=1;else delete l.h[sh.id]}
  const st=hs.find(h=>/шаг/i.test(h.n));
  if(st&&l.st>0){if(l.st>=stepsGoal())l.h[st.id]=1;else delete l.h[st.id]}}
function sleepCard(l){
  const sl=l.sl||{},h=slH(sl),p=S.prof,g=stepsGoal(),st=+l.st||0;
  return `<div class="card"><h3>Сон прошлой ночью <span>${h!=null?fmtH(h):''}</span></h3>
  <div class="fg"><label class="lb">Лёг<input type="time" id="slb" value="${esc(sl.b||'')}"></label><label class="lb">Встал<input type="time" id="slw" value="${esc(sl.w||'')}"></label></div>
  ${p&&p.sleep&&!sl.b?`<button class="btn ghost" id="slplan" style="margin-top:10px;width:100%">Как по распорядку: ${esc(p.sleep)} – ${esc(p.wake)}</button>`:''}
  <div class="chips" style="margin:10px 0 0">${['Плохо','Нормально','Отлично'].map((t,i)=>`<button data-slq="${i+1}" class="${sl.q===i+1?'on':''}">${t}</button>`).join('')}</div>
  <h3 style="margin-top:18px">Шаги <span>цель ${fmtN(g)}</span></h3>
  <input type="number" id="steps" min="0" step="100" inputmode="numeric" placeholder="например, 6500" value="${st||''}" aria-label="Шаги за день" style="width:100%">
  <div class="meter"><i style="width:${Math.min(100,Math.round(st/g*100))}%"></i></div>
  ${st?`<p class="muted">${st>=g?'Цель выполнена':`Осталось ${fmtN(g-st)} · ~${Math.round((g-st)/110)} мин ходьбы`}</p>`:''}</div>`}
function barsHtml(title,vals,goal,fv){
  const has=vals.filter(x=>x.v>0),mx=Math.max(goal*1.15,...vals.map(x=>x.v||0)),avg=has.length?has.reduce((a,x)=>a+x.v,0)/has.length:0;
  return `<div class="card"><h3>${title} <span>${has.length?'в среднем '+fv(avg):'нет данных'}</span></h3><div class="bars">${vals.map(x=>`<div class="bc" title="${parse(x.k).getDate()} ${MN[parse(x.k).getMonth()]}: ${x.v?fv(x.v):'—'}"><i class="${x.v>=goal?'ok':''}" style="height:${Math.round((x.v||0)/mx*82)}%"></i><small>${parse(x.k).getDate()}</small></div>`).join('')}</div></div>`}
function last14(f){const t=new Date(),a=[];for(let i=13;i>=0;i--){const k=key(add(t,-i));a.push({k,v:S.log[k]?f(S.log[k]):0})}return a}

let foodF='Все',foodQ='';
function renderFood(){
  const n=NUT(),sh=mealShares(),p=S.prof||{};
  const mk=t=>{if(!n)return null;const m=S.plan.meals.find(e=>e.n===t)||(t==='Перекус'?S.plan.meals.find(e=>(sh[e.id]||1)<.15):null);return m?n.kcal*sh[m.id]:null};
  const TO={'Завтрак':0,'Обед':1,'Ужин':2,'Перекус':3},list=RCP.filter(r=>foodF==='Все'||(foodF==='Быстрые'?r.min<=15:r.t===foodF)).sort((a,b)=>TO[a.t]-TO[b.t]);
  const cat=n?(n.bmi<18.5?'ниже нормы':n.bmi<25?'норма':n.bmi<30?'выше нормы':'ожирение'):'';
  const top=n?`<div class="card"><h3>Норма в день ${n.kcal!==n.goalK?'<span>на эту неделю</span>':''}</h3>
    <div class="kp"><div><span class="num">${fmtN(n.kcal)}</span><small>ккал</small></div><div><span class="num">${n.prot} г</span><small>белок</small></div><div><span class="num">${n.fat} г</span><small>жиры</small></div><div><span class="num">${n.carb} г</span><small>углеводы</small></div></div>
    <div class="row"><span>Вода</span><input type="number" id="wgoal" min="1" max="20" value="${S.plan.water}" aria-label="Стаканов воды в день" style="flex:0 0 84px"><span class="muted">стаканов ≈ ${String((S.plan.water*.25).toFixed(1)).replace('.',',')} л</span></div>
    <p class="muted">ИМТ ${n.bmi.toFixed(1).replace('.',',')} — ${cat} · расход ≈ ${fmtN(n.tdee)} ккал</p>
    ${n.cur?(()=>{const c=n.cur.v,d=c-n.tdee,kgm=(Math.abs(d)*30/7700).toFixed(1).replace('.',',');
      return `<div class="cmp"><div><small>Ешь сейчас</small><b>${fmtN(c)}</b></div><div><small>Тратишь</small><b>${fmtN(n.tdee)}</b></div><div><small>Цель</small><b>${fmtN(n.goalK)}</b></div></div>
      <p style="margin:0 0 8px">${Math.abs(d)<150?'Сейчас ешь примерно по расходу.':d>0?`<b>+${fmtN(Math.round(d/50)*50)} ккал</b> к расходу → ≈ +${kgm} кг в месяц`:`<b>−${fmtN(Math.round(-d/50)*50)} ккал</b> от расхода → ≈ −${kgm} кг в месяц${c<n.bmr?'. Это меньше обмена в покое — мало.':''}`}</p>
      ${n.steps.length>1?`<div class="stp">${n.steps.map((v,i)=>`<div class="${i===Math.min(n.wk,n.steps.length-1)?'on':''}"><small>Нед. ${i+1}${i===n.steps.length-1?'+':''}</small><b>${fmtN(v)}</b></div>`).join('')}</div>`:''}`})():''}
  </div>
  <div class="card"><h3>Тарелка</h3>
    ${S.plan.meals.map(e=>`<div class="pl"><span class="t"><b>${esc(e.n)}</b> · ≈${fmtN(Math.round(n.kcal*sh[e.id]/10)*10)} ккал<br><span class="muted">${esc(plate(n,sh[e.id],true))}</span></span></div>`).join('')}
    <p class="muted">Ладонь ≈ 100–120 г мяса или творога · горсть ≈ 2–3 ложки крупы · палец ≈ 1 ч. л. масла</p>
  </div>`
  :`<div class="card hi wide"><h3>Посчитаю твою норму</h3><p style="margin:0 0 12px">Заполни профиль — появятся калории, белок, вода и порции.</p><button class="btn" data-v="me">Заполнить</button></div>`;
  $('#v-food').innerHTML=`<h2 class="pt">Питание</h2><div class="grid">${top}</div>
  <div class="sh"><h3>Рецепты <span class="muted" style="font-size:14px;font-weight:500">${RCP.length}</span></h3></div>
  <input type="search" id="rq" placeholder="Поиск: курица, творог, гречка…" value="${esc(foodQ)}" aria-label="Поиск рецептов" style="width:100%;margin-bottom:10px">
  <div class="chips">${['Все','Быстрые','Завтрак','Обед','Ужин','Перекус'].map(f=>`<button data-ff="${f}" class="${f===foodF?'on':''}">${f}</button>`).join('')}</div>
  <div class="grid" id="rlist">${list.map(r=>{const m=mk(r.t);let fit='';if(m){const f=Math.min(2.5,Math.max(.5,Math.round(m/r.kcal*4)/4));fit=`<em>Тебе: ${f===1?'1 порция':String(f).replace('.',',')+' порции'} ≈ ${fmtN(Math.round(r.kcal*f/10)*10)} ккал</em>`}
    return `<details class="card rcp" data-s="${esc((r.n+' '+r.ing.join(' ')).toLowerCase())}"><summary><b>${esc(r.n)}</b><span class="muted">${r.t} · ${r.min} мин · ${r.kcal} ккал · ${r.p} г белка</span>${fit}</summary>
    <h4>Продукты</h4><ul>${r.ing.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><h4>Как готовить</h4><ol>${r.st.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></details>`}).join('')}</div>`;
  filterRcp();
}

const LVN=['Новичок','Разогретый','Упорный','Крепкий','Спортивный','Выносливый','Сильный','Атлет','Железный','Легенда'];
function xpTotal(){let x=0;const g=stepsGoal();
  for(const k in S.log){const l=S.log[k],ex=S.plan.days[parse(k).getDay()]||[];
    x+=Object.keys(l.x||{}).length*10;if(ex.length&&ex.every(e=>l.x[e.id]))x+=30;
    x+=Object.keys(l.m||{}).length*5+Object.keys(l.h||{}).length*5;if(l.w>=S.plan.water)x+=10;
    if(slH(l.sl)!=null)x+=5;if(l.st>=g)x+=10;if(l.r)x+=5}
  x+=Object.keys(S.badges||{}).length*100;
  for(const id in(S.rec||{})){let b=-1;for(const r of S.rec[id]){x+=10;if(r.v>b){if(b>=0)x+=50;b=r.v}}}
  return x}
const need=n=>50*n*(n-1);
function lvl(x){let n=1;while(x>=need(n+1))n++;return{n,cur:x-need(n),span:need(n+1)-need(n),name:n<=LVN.length?LVN[n-1]:LVN[LVN.length-1]+' '+(n-LVN.length+1)}}
function renderLv(){const v=lvl(xpTotal());$('#lv').innerHTML=`<span class="lvn">Ур. ${v.n}</span><span class="lvt"><span>${v.name}</span><i><b style="width:${Math.round(v.cur/v.span*100)}%"></b></i><small>${v.cur} / ${v.span} XP</small></span>`}
function checkLevel(){const v=lvl(xpTotal()),mx=S.lvlMax||S.lvl||1;
  if(v.n>mx&&S.lvl){const t=$('#toast'),go=()=>{toast(`Новый уровень ${v.n}: «${v.name}»!`);confetti();buzz([20,40,20])};t.hidden?go():setTimeout(go,2600)}
  S.lvlMax=Math.max(mx,v.n);S.lvl=v.n}

/* ---------- оформление и копия ---------- */
const PAL=[['Томат','#f04e23','#2b2140'],['Океан','#1e88e5','#0f2238'],['Лес','#2e9d5b','#14261c'],['Ягода','#d6336c','#2a1424'],['Апельсин','#f28c18','#2a1d12'],['Сирень','#7c5cff','#1d1838']];
function applyUI(){const u=S.ui||{},r=document.documentElement;
  if(u.theme==='light'||u.theme==='dark')r.dataset.theme=u.theme;else if(u.theme==='auto')delete r.dataset.theme;
  const p=PAL[u.acc||0]||PAL[0];r.style.setProperty('--red',p[1]);r.style.setProperty('--plum',p[2]);
  const mt=document.querySelector('meta[name=theme-color]');if(mt)mt.content=p[2]}
const uiCard=()=>`<div class="card"><h3>Оформление</h3><p class="muted" style="margin:0 0 6px">Тема</p>
  <div class="chips">${[['auto','Как в системе'],['light','Светлая'],['dark','Тёмная']].map(([v,t])=>`<button data-th="${v}" class="${((S.ui||{}).theme||'auto')===v?'on':''}">${t}</button>`).join('')}</div>
  <p class="muted" style="margin:6px 0">Цвет</p><div class="sw">${PAL.map((p,i)=>`<button data-acc="${i}" class="${((S.ui||{}).acc||0)===i?'on':''}" style="--c:${p[1]};--d:${p[2]}"><span></span>${p[0]}</button>`).join('')}</div></div>`;
let bArm=false;
const bkCard=()=>`<div class="card"><h3>Резервная копия</h3>
  <button class="btn" id="bcopy" style="width:100%">Скопировать все данные</button>
  <textarea id="bin" rows="3" placeholder="Вставь сюда скопированные данные" aria-label="Данные для восстановления"></textarea>
  <button class="btn ghost" id="bload" style="width:100%">Восстановить из копии</button><p class="muted" id="bmsg"></p></div>`;

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-ff],[data-th],[data-acc],[data-slq],#slplan,#bcopy,#bload');if(!t)return;
  if(t.dataset.ff){foodF=t.dataset.ff;renderFood();return}
  if(t.dataset.th){S.ui=Object.assign({},S.ui,{theme:t.dataset.th});applyUI();persist();renderMe();return}
  if(t.dataset.acc){S.ui=Object.assign({},S.ui,{acc:+t.dataset.acc});applyUI();persist();renderMe();renderLv();return}
  if(t.dataset.slq){const l=L(cur);l.sl=Object.assign({},l.sl,{q:+t.dataset.slq});changed();return}
  if(t.id==='slplan'){const l=L(cur);l.sl=Object.assign({},l.sl,{b:S.prof.sleep,w:S.prof.wake});autoHabit(cur);changed();return}
  if(t.id==='bcopy'){const j=JSON.stringify(S),ok=()=>{$('#bmsg').textContent='Скопировано. Вставь это в приложении на телефоне: «Я» → «Восстановить из копии».'};
    const fb=()=>{const b=$('#bin');b.value=j;b.focus();b.select();$('#bmsg').textContent='Выдели текст в поле выше и скопируй вручную.'};
    try{navigator.clipboard.writeText(j).then(ok,fb)}catch(er){fb()}return}
  if(t.id==='bload'){let o;try{o=JSON.parse($('#bin').value)}catch(er){$('#bmsg').textContent='Не получается прочитать данные — скопируй их ещё раз целиком.';return}
    if(!o||!o.plan||!o.log){$('#bmsg').textContent='Это не похоже на копию из этого приложения.';return}
    if(!bArm){bArm=true;$('#bmsg').textContent='Текущие данные заменятся копией. Нажми ещё раз, чтобы подтвердить.';return}
    bArm=false;S=o;migrate();checkBadges(true);changed();toast('Данные восстановлены');return}
});
document.addEventListener('change',e=>{const id=e.target.id;
  if(id==='slb'||id==='slw'){const l=L(cur);l.sl=Object.assign({},l.sl,{[id==='slb'?'b':'w']:e.target.value});autoHabit(cur);changed()}
  if(id==='steps'){const l=L(cur);l.st=Math.max(0,parseInt(e.target.value)||0);autoHabit(cur);changed()}
});
document.addEventListener('submit',e=>{const f=e.target;if(!f.dataset.rec)return;e.preventDefault();
  const id=f.dataset.rec,v=parseInt(f.elements.namedItem('v').value);if(!(v>0))return;
  const prev=recBest(id);S.rec=S.rec||{};(S.rec[id]=S.rec[id]||[]).push({d:TODAY(),v});
  changed();const t=TESTS.find(x=>x.id===id);toast(prev==null?`Первый результат записан: ${v} ${t.u}. Дальше будем его бить!`:v>prev?`Новый рекорд! ${t.n}: ${v} ${t.u} (+${v-prev}) · +50 XP`:`Записано. Рекорд пока ${prev} ${t.u} — в следующий раз!`)});
try{const u=JSON.parse(localStorage.getItem('forma-ui')||'null');if(u&&!S.ui)S.ui=u}catch(e){}
S.lvl=S.lvl||lvl(xpTotal()).n;S.lvlMax=S.lvlMax||S.lvl;if(!S.seenB){S.seenB={};for(const id in(S.badges||{}))S.seenB[id]=1}

function tlToggle(t){fxAct(t,()=>tlToggle0(t))}
function tlToggle0(t){const[k,id]=t.dataset.tl.split('|'),l=L(cur);
  if(k==='meal'){l.m[id]?delete l.m[id]:l.m[id]=1}
  else if(k==='wo'){const ex=S.plan.days[parse(cur).getDay()]||[],all=ex.every(e=>l.x[e.id]);ex.forEach(e=>all?delete l.x[e.id]:l.x[e.id]=1)}
  else{l.sc=l.sc||{};if(l.sc[id])delete l.sc[id];else{l.sc[id]=1;if(id==='wake'&&!l.w){l.w=1;toast('Отмечено. Плюс 1 стакан воды')}}}
  changed()}
document.addEventListener('click',e=>{const t=e.target.closest('[data-tl]');if(t)tlToggle(t)});
document.addEventListener('keydown',e=>{const t=e.target.closest&&e.target.closest('[data-tl]');if(t&&(e.key===' '||e.key==='Enter')){e.preventDefault();tlToggle(t)}});
/* ---------- свой сервер: синхронизация и уведомления ---------- */
const IN_CLAUDE=typeof window.claude!=='undefined';
const SVK='forma-server';
const SV=()=>{try{return JSON.parse(localStorage.getItem(SVK)||'null')}catch(e){return null}};
let syncT=null,syncing=false,syncMsg='';
function setSync(m){syncMsg=m;const e=$('#svst');if(e)e.textContent=m}
async function api(p,b){const c=SV();if(!c||!c.url)throw Error('Сервер не указан');
  const r=await fetch(c.url.replace(/\/+$/,'')+p,{method:b?'POST':'GET',headers:{'Authorization':'Bearer '+c.key,'Content-Type':'application/json','ngrok-skip-browser-warning':'1'},body:b?JSON.stringify(b):undefined});
  if(r.status===401)throw Error('неверный ключ');if(!r.ok)throw Error('сервер ответил '+r.status);return r.json()}
function buildRem(){const out=[],t=new Date();if(!S.prof)return out;const n=NUT(),sh=mealShares();
  for(let dd=0;dd<2;dd++){const d=add(t,dd),k=key(d),base=new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime(),ex=S.plan.days[d.getDay()]||[],at=m=>base+Math.round(m)*60000;
    for(const it of SCHED(k)){
      if(it.kind==='wo'){const ids=ex.map(e=>e.id);
        out.push({id:k+'|wo|pre',at:at(it.m-30),title:'Через 30 минут — '+(ex.length>2?'тренировка':it.n.toLowerCase()),body:ex.map(e=>e.n).slice(0,4).join(', '),chk:{d:k,k:'wo',ids}});
        out.push({id:k+'|wo|late',at:at(it.m+120),title:'Тренировка ещё не отмечена',body:'Сделал — отметь. Нет — ещё не поздно хотя бы на 10 минут.',chk:{d:k,k:'wo',ids}})}
      else if(it.kind==='meal')out.push({id:k+'|m|'+it.id,at:at(it.m),title:it.n+' · '+hm(it.m),body:n?`≈${fmtN(Math.round(n.kcal*sh[it.id]/10)*10)} ккал · ${plate(n,sh[it.id])}`:'Пора поесть — и отметь в приложении',chk:{d:k,k:'m',id:it.id}});
      else if(it.id==='screen')out.push({id:k+'|x|screen',at:at(it.m),title:'Через 30 минут отбой',body:'Телефон в сторону, свет потише.',chk:{d:k,k:'x',id:'screen'}})}
    const p=S.prof;if(p.sleep&&p.wake){let sl=tm(p.sleep);if(sl<=tm(p.wake))sl+=1440;out.push({id:k+'|water',at:at(sl-150),title:'Как с водой?',body:`Норма — ${S.plan.water} стаканов. Отметь, сколько выпил.`,chk:{d:k,k:'w',n:S.plan.water}})}}
  return out.filter(r=>r.at>Date.now()-60000)}
function queueSync(){if(!SV())return;clearTimeout(syncT);syncT=setTimeout(syncNow,1500)}
async function syncNow(){const c=SV();if(!c||!c.url)return;if(syncing){queueSync();return}syncing=true;
  try{if((S.ui||{}).push)S.rem=buildRem();const before=JSON.stringify(S);
    const r=await api('/api/sync',{state:S});
    if(r&&r.state&&r.state.log&&JSON.stringify(S)===before){const after=JSON.stringify(r.state);
      if(after!==before){S=r.state;migrate();try{localStorage.setItem(LS,after)}catch(e){}render()}}
    else queueSync();
    setSync('Синхронизировано в '+hm(new Date().getHours()*60+new Date().getMinutes()))}
  catch(e){setSync('Нет связи с сервером: '+e.message+'. Данные сохранены на телефоне.')}
  finally{syncing=false}}
const b64u=s=>{const b=atob((s+'='.repeat((4-s.length%4)%4)).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(b,c=>c.charCodeAt(0))};
async function enablePush(){
  if(!('serviceWorker' in navigator)||!('PushManager' in window)||!('Notification' in window))throw Error('этот браузер не умеет уведомления — открой приложение в Chrome');
  if(await Notification.requestPermission()!=='granted')throw Error('уведомления запрещены — разреши их в настройках Chrome для сайта');
  const{key}=await api('/api/vapid');if(!key)throw Error('на сервере не установлен web-push');
  const reg=await navigator.serviceWorker.ready;let sub=await reg.pushManager.getSubscription();
  if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(key)});
  await api('/api/subscribe',{sub:sub.toJSON()});S.ui=Object.assign({},S.ui,{push:true});persist();await syncNow()}
const svCard=()=>{if(IN_CLAUDE)return'';const c=SV()||{};return `<div class="card"><h3>Свой сервер</h3>
  <label class="lb">Адрес сервера<input type="url" id="svu" placeholder="https://имя.ngrok-free.app" value="${esc(c.url||'')}" autocomplete="off"></label>
  <label class="lb" style="margin-top:8px">Ключ<input type="password" id="svk" value="${esc(c.key||'')}" autocomplete="off"></label>
  <div class="row" style="margin-top:10px"><button class="btn" id="svgo">${c.url?'Сохранить и проверить':'Подключить'}</button>${c.url?'<button class="btn ghost" id="svoff">Отключить</button>':''}</div>
  ${c.url?`<div class="row" style="margin-top:8px"><button class="btn ghost" id="svpush">${(S.ui||{}).push?'Обновить уведомления':'Включить уведомления'}</button><button class="btn ghost" id="svtest">Тест</button>${(S.ui||{}).push?'<button class="btn ghost" id="svpoff">Выключить</button>':''}</div>`:''}
  <p class="muted" id="svst">${esc(syncMsg)}</p></div>`};
document.addEventListener('click',async e=>{const t=e.target.closest('#svgo,#svoff,#svpush,#svtest,#svpoff');if(!t)return;
  try{
    if(t.id==='svgo'){let u=$('#svu').value.trim();const k=$('#svk').value.trim();if(!u||!k){setSync('Впиши адрес и ключ.');return}
      if(!/^https?:\/\//.test(u))u='https://'+u;localStorage.setItem(SVK,JSON.stringify({url:u,key:k}));setSync('Проверяю…');await syncNow();renderMe();return}
    if(t.id==='svoff'){localStorage.removeItem(SVK);syncMsg='Сервер отключён. Данные остались на телефоне.';renderMe();return}
    if(t.id==='svpush'){setSync('Включаю…');await enablePush();renderMe();toast('Уведомления включены. Нажми «Тест», чтобы проверить.');return}
    if(t.id==='svpoff'){S.ui=Object.assign({},S.ui,{push:false});S.rem=[];persist();await syncNow();renderMe();toast('Уведомления выключены');return}
    if(t.id==='svtest'){const r=await api('/api/test',{});toast(r.sent?'Отправлено — уведомление придёт через пару секунд':'Нет подписанных устройств — сначала «Включить уведомления»');return}
  }catch(er){setSync('Не получилось: '+er.message)}});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')syncNow()});
setInterval(()=>{if(document.visibilityState==='visible')syncNow()},120000);

function filterRcp(){const q=foodQ.trim().toLowerCase();let n=0;document.querySelectorAll('#rlist .rcp').forEach(d=>{const ok=!q||q.split(/\s+/).every(w=>d.dataset.s.includes(w.length>4?w.slice(0,Math.max(3,w.length-2)):w));d.hidden=!ok;if(ok)n++});
  let e=$('#rnone');if(!e&&$('#rlist')){e=document.createElement('p');e.id='rnone';e.className='rest';$('#rlist').after(e)}if(e)e.textContent=n?'':'Ничего не нашлось'}
document.addEventListener('input',e=>{if(e.target.id==='rq'){foodQ=e.target.value;filterRcp()}});
render();
if(SV())syncNow();

/* ---------- облако: свои данные у каждого, на всех устройствах ---------- */
(async()=>{
  try{
    const[d,u]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!d||!u)return;
    const id=await u.id();if(!id)return;

  }catch(e){$('#save').textContent=''}
})();
}
