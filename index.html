<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2b2140">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Трекер тренировок и питания</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Onest:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: бодрый тренер, коротко и по делу
   IDEA: карточка-чеклист на холодильнике, куда ставишь галочки
   PICTURE: большое кольцо прогресса дня + полоса недели
   COLOUR and TYPE: томатный, глубокий баклажан, лайм для «сделано»; Unbounded + Onest
   LAYOUT: шапка-полоса с кольцом, ниже колонки чеклистов, вкладки План и История */
:root{color-scheme:light dark;--bg:light-dark(#fbf8f5,#15111d);--card:light-dark(#fff,#1f1a2b);--ink:light-dark(#1b1624,#f3eff8);--mut:light-dark(#6c6478,#a69db3);--line:light-dark(#ebe4dc,#2f2840);--red:#f04e23;--plum:#2b2140;--lime:#c6f432;--limeInk:#1b2400}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Onest,system-ui,sans-serif;overflow-x:clip}
h1,h2,.num{font-family:Unbounded,Onest,sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.top{background:var(--plum);color:#fff;padding:20px max(5vw,16px) 0}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;max-width:1100px;margin:0 auto}
h1{font-size:clamp(22px,4vw,32px);line-height:1.05;margin:0;font-weight:800}
h1 b{color:var(--red)}
.tabs{display:flex;gap:6px;background:#ffffff14;padding:4px;border-radius:999px}
.tabs button{border:0;background:none;color:#fff;padding:10px 16px;border-radius:999px;min-height:44px;font-weight:500}
.tabs button[aria-selected=true]{background:#fff;color:var(--plum)}
.hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(16px,4vw,48px);align-items:center;max-width:1100px;margin:0 auto;padding:22px 0 26px}
.ring{position:relative;width:clamp(150px,30vw,200px);aspect-ratio:1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .num{font-size:clamp(34px,7vw,48px);font-weight:800;line-height:1}
.ring small{color:#cfc6dd;font-size:13px}
.prog{transition:stroke-dashoffset .6s ease}
@media(prefers-reduced-motion:reduce){.prog{transition:none}}
.date{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.date h2{font-size:clamp(20px,3.4vw,28px);margin:0;line-height:1.1;font-weight:600}
.ib{border:1px solid #ffffff40;background:none;color:#fff;width:44px;height:44px;border-radius:50%;font-size:20px}
.tdy{border:0;background:var(--red);color:#fff;border-radius:999px;padding:0 14px;height:36px;font-size:14px}
.sub{color:#cfc6dd;margin:6px 0 14px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;max-width:460px}
.week button{border:0;border-radius:12px;background:#ffffff12;color:#fff;padding:8px 0 6px;min-height:58px;display:grid;gap:4px;justify-items:center;font-size:13px}
.week button.on{outline:2px solid #fff}
.week i{display:block;width:70%;height:6px;border-radius:3px;background:#ffffff22;overflow:hidden}
.week i b{display:block;height:100%;background:var(--lime)}
main{max-width:1100px;margin:0 auto;padding:24px max(5vw,16px) 60px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:18px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px}
.card h3{margin:0 0 10px;font-size:18px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.card h3 span{font-size:14px;color:var(--mut);font-weight:500;white-space:nowrap}
.it{display:flex;align-items:center;gap:12px;padding:10px 4px;border-top:1px solid var(--line);min-height:52px;cursor:pointer;user-select:none}
.it:first-of-type{border-top:0}
.box{flex:none;width:30px;height:30px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;transition:background .15s}
.it.done .box{background:var(--lime);border-color:var(--lime)}
.it.done .box::after{content:"";width:12px;height:7px;border:3px solid var(--limeInk);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.it .t{flex:1}
.it.done .t{color:var(--mut);text-decoration:line-through}
.it .d{color:var(--mut);font-size:14px;white-space:nowrap}
.rest{color:var(--mut);padding:8px 4px}
.water{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.water button{width:38px;height:44px;border:2px solid var(--line);background:none;border-radius:8px 8px 12px 12px;position:relative;overflow:hidden}
.water button.f{background:#3aa0e8;border-color:#3aa0e8}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=text],input[type=number],select{min-height:44px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 12px;font-size:16px;flex:1 1 140px}
.btn{min-height:44px;border:0;border-radius:12px;padding:0 16px;background:var(--red);color:#fff;font-weight:700}
.ghost{background:none;border:1px solid var(--line);color:var(--ink)}
.del{border:0;background:none;color:var(--mut);width:44px;height:44px;font-size:22px;border-radius:10px}
.del:hover{color:var(--red)}
.pl{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding:4px 0}
.pl:first-child{border-top:0}
.pl .t{flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chips button{min-height:44px;min-width:52px;border:1px solid var(--line);background:none;border-radius:999px;padding:0 14px}
.chips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal div{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font-size:13px;border:1px solid var(--line);cursor:pointer}
.cal .h{border:0;color:var(--mut);aspect-ratio:auto;cursor:default}
.stat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:18px}
.stat div{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
.stat .num{font-size:clamp(22px,4vw,34px);font-weight:800;display:block;line-height:1.1}
.stat small{color:var(--mut)}
.fig{position:relative;height:200px}.fig svg{position:absolute;inset:0;width:100%;height:100%}
.muted{color:var(--mut);font-size:14px}
.save{font-size:13px;color:#cfc6dd}
[hidden]{display:none!important}
.it .t small{display:block;color:var(--mut);font-size:13px;line-height:1.35;margin-top:2px}
.it .d{white-space:normal;text-align:right;max-width:42%}
.qi{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--mut);font-weight:700}
.btn.big{width:100%;min-height:54px;font-size:17px;margin-bottom:8px}
.nb{background:color-mix(in srgb,var(--red) 10%,var(--card));border:1px solid color-mix(in srgb,var(--red) 35%,transparent);border-radius:16px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.card.hi{background:var(--red);color:#fff;border:0}.card.hi .btn{background:#fff;color:var(--red)}
.tl{display:grid;grid-template-columns:54px minmax(0,1fr) 24px;gap:10px;padding:8px 6px;border-top:1px solid var(--line);align-items:center}
.tl:first-child{border-top:0}
.tt{font-weight:700;font-variant-numeric:tabular-nums}
.tl.ok{color:var(--mut)}.tk{color:var(--limeInk);background:var(--lime);border-radius:50%;width:22px;height:22px;display:grid;place-items:center;font-size:13px}
.tl.nx{background:color-mix(in srgb,var(--lime) 28%,transparent);border-radius:10px;border-color:transparent}
.tl.miss .tt{color:var(--red)}
.ov{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:#0009}
.mc{background:var(--card);border-radius:22px;padding:22px;max-width:480px;width:100%;max-height:90vh;overflow:auto;position:relative}
.mc .x{position:absolute;top:8px;right:8px}
.steps{padding-left:22px;margin:10px 0 0}.steps li{margin:6px 0}
#wo{background:var(--plum);color:#fff;display:block;overflow:auto;padding:0}
.wo-in{max-width:560px;margin:0 auto;padding:16px 20px 28px;display:flex;flex-direction:column;min-height:100%}
.wtop{display:flex;justify-content:space-between;align-items:center}
#wob{display:flex;flex-direction:column;flex:1}
.wbar{height:6px;background:#ffffff22;border-radius:3px;overflow:hidden;margin:8px 0 10px}.wbar i{display:block;height:100%;background:var(--lime)}
.wl{color:#cfc6dd;margin:4px 0}
.wn{font-family:Unbounded,sans-serif;font-size:clamp(26px,6vw,38px);line-height:1.1;margin:14px 0 4px;text-wrap:balance}
.wbig{font-family:Unbounded,sans-serif;font-size:clamp(72px,22vw,128px);font-weight:800;line-height:1;margin:18px 0 6px;color:var(--lime);font-variant-numeric:tabular-nums}
.wt{margin:16px 0 0;padding-left:20px;color:#e6dff0;font-size:15px}.wt li{margin:4px 0}
.wbtn{display:flex;flex-wrap:wrap;gap:10px;margin-top:auto;padding-top:24px}.wbtn .btn{flex:1 1 180px;min-height:56px;font-size:17px}
.ghostw{background:none;border:1px solid #ffffff55;color:#fff}
.rate{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:20px}.rate button{min-height:72px;border-radius:16px;border:0;font-weight:700;font-size:16px;background:#ffffff18;color:#fff}.rate button:hover,.rate button:focus-visible{background:var(--lime);color:var(--limeInk)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;z-index:60;width:max-content;max-width:calc(100% - 32px);box-shadow:0 8px 24px #0004}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 10px}
form label{display:grid;gap:4px;font-size:14px;color:var(--mut);margin-top:10px}
form label input,form label select{color:var(--ink);width:100%;flex:none}
input[type=time]{min-height:44px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 12px;font-size:16px}
.kp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:6px 0 12px}.kp div{background:var(--bg);border-radius:14px;padding:12px}.kp .num{font-size:clamp(20px,3vw,26px);font-weight:800;display:block;white-space:nowrap}.kp small{color:var(--mut)}
.bd{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:14px}
.bd div{text-align:center;font-size:13px;color:var(--mut);line-height:1.35}.bd b{display:block;color:var(--ink);font-size:14px}
.bd svg{width:64px;height:64px;display:block;margin:0 auto 6px}.bd .no{opacity:.5}
.pic{margin:12px 0 4px}.pic svg{width:100%;max-width:340px;height:auto;display:block;margin:0 auto}
.pic path,.pic circle{fill:none;stroke:currentColor;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.pic .fl{opacity:.38}.pic .hd{fill:currentColor}.pic .pr{stroke-width:3;opacity:.45}.pic .fr{stroke-width:2;opacity:.3}.pic .ar{stroke:var(--red);stroke-width:3}
.pic figcaption{display:grid;grid-template-columns:1fr 1fr;max-width:340px;margin:2px auto 0;text-align:center;font-size:13px;opacity:.8}
.lb{display:grid;gap:4px;font-size:14px;color:var(--mut)}.lb input{width:100%;color:var(--ink)}
.meter{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin:10px 0 4px}.meter i{display:block;height:100%;background:var(--red);border-radius:5px}
.bars{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:4px;height:150px}
.bc{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%}
.bc i{display:block;width:100%;min-height:3px;border-radius:6px 6px 2px 2px;background:color-mix(in srgb,var(--mut) 35%,transparent)}.bc i.ok{background:var(--red)}
.bc small{font-size:12px;color:var(--mut)}
.rc{border-top:1px solid var(--line);padding:12px 0}.rc:first-of-type{border-top:0;padding-top:0}
.rh{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:8px}.rh small{display:block;color:var(--mut);font-size:13px}
.rv{text-align:right;white-space:nowrap}.rv .num{font-size:26px;font-weight:800}.rv small{display:block;color:var(--red);font-size:13px}
.rc form input{flex:1 1 120px}
.rcp summary{cursor:pointer;display:grid;gap:4px;list-style:none}.rcp summary::-webkit-details-marker{display:none}
.rcp summary b{font-size:17px}.rcp summary::after{content:"Рецепт ▾";color:var(--red);font-size:14px;font-weight:700}.rcp[open] summary::after{content:"Свернуть ▴"}
.rcp em{font-style:normal;background:color-mix(in srgb,var(--lime) 35%,transparent);border-radius:8px;padding:4px 8px;font-size:14px;justify-self:start}
.rcp h4{margin:14px 0 4px}.rcp ul,.rcp ol{margin:0;padding-left:20px}.rcp li{margin:3px 0}
.lv{display:flex;align-items:center;gap:10px;color:#fff;margin-inline-end:auto}
.lvn{background:var(--red);border-radius:10px;padding:5px 10px;font-family:Unbounded,sans-serif;font-weight:800;font-size:14px;white-space:nowrap}
.lvt{display:grid;font-size:13px;min-width:110px;line-height:1.2}.lvt i{display:block;height:6px;background:#ffffff26;border-radius:3px;overflow:hidden;margin:4px 0 2px}.lvt b{display:block;height:100%;background:var(--lime)}.lvt small{color:#cfc6dd;font-size:12px}
.sw{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.sw button{min-height:52px;border:1px solid var(--line);border-radius:14px;background:none;display:flex;align-items:center;gap:8px;padding:0 10px;font-size:14px}
.sw span{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,var(--c) 50%,var(--d) 50%);flex:none}.sw button.on{outline:2px solid var(--ink);outline-offset:1px}
textarea{width:100%;margin:10px 0;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:10px;font:14px/1.4 inherit;resize:vertical}
.tabs{overflow-x:auto;scrollbar-width:none}.tabs button{flex:none}
.cmp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:6px 0 10px}.cmp div{background:var(--bg);border-radius:14px;padding:10px;display:grid}.cmp small,.cmp span{color:var(--mut);font-size:13px}.cmp b{font-family:Unbounded,sans-serif;font-size:clamp(17px,2.6vw,22px)}
.stp{display:flex;flex-wrap:wrap;gap:6px}.stp div{border:1px solid var(--line);border-radius:12px;padding:6px 10px;display:grid}.stp small{color:var(--mut);font-size:12px}.stp .on{background:var(--red);color:#fff;border-color:var(--red)}.stp .on small{color:#fff}
.tl.tap{cursor:pointer;user-select:none}.tl.tap:hover{background:color-mix(in srgb,var(--line) 50%,transparent);border-radius:10px}
.tc{width:22px;height:22px;border-radius:50%;border:2px solid var(--line)}
@media(max-width:600px){.hero{grid-template-columns:minmax(0,1fr);justify-items:center;text-align:center}.date{justify-content:center}.week{margin:0 auto}.tabs button{padding:10px 12px}}
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <h1>Форма<b>.</b>дома</h1>
    <div class="lv" id="lv"></div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-v="today" aria-selected="true">Сегодня</button>
      <button role="tab" data-v="plan" aria-selected="false">План</button>
      <button role="tab" data-v="food" aria-selected="false">Еда</button>
      <button role="tab" data-v="hist" aria-selected="false">История</button>
      <button role="tab" data-v="me" aria-selected="false">Я</button>
    </nav>
  </div>
  <div class="hero" id="hero">
    <div class="ring">
      <svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="#ffffff1f" stroke-width="12"/><circle class="prog" id="prog" cx="60" cy="60" r="52" fill="none" stroke="#c6f432" stroke-width="12" stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="326.7"/></svg>
      <div class="c"><span class="num" id="pct">0%</span><small id="cnt">0 из 0</small></div>
    </div>
    <div>
      <div class="date"><button class="ib" id="prev" aria-label="Предыдущий день">‹</button><h2 id="dt"></h2><button class="ib" id="next" aria-label="Следующий день">›</button><button class="tdy" id="tdy" hidden>К сегодня</button></div>
      <p class="sub" id="dsub"></p>
      <div class="week" id="week"></div>
      <p class="save" id="save">Данные сохраняются автоматически</p>
    </div>
  </div>
</header>

<main>
  <section id="v-today" class="grid"></section>
  <section id="v-plan" hidden></section>
  <section id="v-hist" hidden></section>
  <section id="v-food" hidden></section>
  <section id="v-me" hidden></section>
</main>
<div id="wo" class="ov" hidden role="dialog" aria-modal="true" aria-label="Тренировка"><div class="wo-in"><div class="wtop"><b>Тренировка</b><button class="ib" data-wa="close" aria-label="Закрыть">×</button></div><div id="wob"></div></div></div>
<div id="modal" class="ov" hidden><div class="mc" role="dialog" aria-modal="true"><button class="del x" data-close aria-label="Закрыть">×</button><div id="mbody"></div></div></div>
<div id="toast" class="toast" hidden role="status"></div>

<script>
{
const DN=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
const DL=['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
const MN=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
let uid=0;const nid=()=>Date.now().toString(36)+(uid++);
const X=(n,d,t)=>({id:nid(),n,d,t});
const P=(n,...s)=>({id:nid(),n,s});
const STAGES=['Знакомство','Привыкание','Укрепление','Уверенный старт'];
const tk=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const warm=()=>P('Разминка: суставы + ходьба на месте','5 мин','5 мин','7 мин','7 мин');
const cool=()=>P('Растяжка','5 мин','5 мин','7 мин','10 мин');
const DEF={plan:{ver:2,start:tk(),
  days:{
    1:[warm(),P('Приседания','к стулу · 2×8','к стулу · 2×12','3×12','3×15'),P('Отжимания','от стены · 2×8','от стены · 3×10','от стола · 3×8','с колен · 3×10'),P('Ягодичный мост','2×10','3×10','3×15','3×20'),P('Планка','на коленях · 2×15 с','2×20 с','3×25 с','3×35 с'),cool()],
    2:[P('Быстрая ходьба','20 мин','25 мин','30 мин','35 мин'),P('Растяжка','5 мин','5 мин','10 мин','10 мин')],
    3:[warm(),P('Выпады назад','у опоры · 2×5 на ногу','у опоры · 2×8','3×8','3×10'),P('Отжимания','от стены · 2×8','от стены · 3×10','от стола · 3×8','с колен · 3×10'),P('Птица-собака','2×6 на сторону','2×8','3×8','3×10'),P('Супермен','2×8','2×10','3×10','3×12'),cool()],
    4:[P('Быстрая ходьба','20 мин','25 мин','30 мин','35 мин'),P('Растяжка','5 мин','5 мин','10 мин','10 мин')],
    5:[warm(),P('Приседания','к стулу · 2×8','к стулу · 2×12','3×12','3×15'),P('Подъёмы на носки','2×10','2×15','3×15','3×20'),P('Отжимания','от стены · 2×8','от стены · 3×10','от стола · 3×8','с колен · 3×10'),P('Скручивания лёжа','2×8','2×12','3×12','3×15'),P('Планка','на коленях · 2×15 с','2×20 с','3×25 с','3×35 с'),cool()],
    6:[P('Прогулка','30 мин','35 мин','40 мин','45 мин')],
    0:[]},

  let sum=0,n=0,full=0;for(let i=0;i<30;i++){const s=score(key(add(t,-i)));if(S.log[key(add(t,-i))]){sum+=s.p;n++}if(s.p>=0.999)full++}

  drawWeight();
}

/* ---------- профиль, питание, распорядок ---------- */
const tm=s=>{const[a,b]=String(s||'0:0').split(':').map(Number);return(a||0)*60+(b||0)};
const hm=m=>{m=((Math.round(m/5)*5)%1440+1440)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
const fmtN=v=>Number(v).toLocaleString('ru-RU');
const lastKg=()=>{const ks=Object.keys(S.log).sort().reverse();for(const k of ks){const v=parseFloat(S.log[k].kg);if(v>0)return v}return null};
function curIntake(){const p=S.prof;if(!p)return null;
  if(+p.ck>0)return{v:+p.ck,src:'со слов'};
  if(!p.ps)return null;
  const per={s:400,m:600,l:850,x:1100}[p.ps]||600,ms=S.plan.meals,sh=mealShares();
  let v=0;ms.forEach(e=>{v+=sh[e.id]<.15?200:per});v+={no:0,some:150,day:400}[p.jf]||0;
  return{v:Math.round(v/50)*50,src:'оценка по порциям'}}
function NUT(){
  const p=S.prof;if(!p||!(p.w>0&&p.h>0&&p.age>0))return null;
  const w=lastKg()||+p.w,h=+p.h,a=+p.age,m=p.sex!=='f';
  const bmi=w/((h/100)**2),bmr=10*w+6.25*h-5*a+(m?5:-161);
  const tdee=bmr*({sit:1.375,feet:1.55,hard:1.7}[p.act]||1.375);
  let goalK=p.goal==='lose'?tdee*0.85:p.goal==='gain'?tdee*1.1:tdee;
  goalK=Math.round(Math.max(goalK,m?1500:1200)/50)*50;
  const cur=curIntake(),steps=[];let kcal=goalK;
  if(cur){const STEP=cur.v>goalK?250:200,gap=goalK-cur.v;
    if(Math.abs(gap)>STEP){let v=cur.v;while(Math.abs(goalK-v)>STEP){v+=Math.sign(gap)*STEP;steps.push(Math.round(v/50)*50)}steps.push(goalK);
      const wk=p.at?Math.max(0,Math.floor((parse(TODAY())-parse(p.at))/864e5/7)):0;kcal=steps[Math.min(wk,steps.length-1)]}}
  const base=bmi>=30?25*(h/100)**2:w;

function SCHED(k){
  const p=S.prof;if(!p||!p.wake||!p.sleep)return[];
  const dw=parse(k).getDay(),ex=S.plan.days[dw]||[],strong=ex.length>2;
  const wake=tm(p.wake);let sleep=tm(p.sleep);if(sleep<=wake)sleep+=1440;
  let work=null;if(p.wd!=='none'&&p.ws&&p.we){const a=tm(p.ws);let b=tm(p.we);if(b<=a)b+=1440;work=[a,b]}
  const workDay=work&&(p.wd==='all'||(dw>=1&&dw<=5));
  const out=[],A=(m,n,kind,id)=>out.push({m,n,kind,id});
  let wo=null;
  if(ex.length){if(p.wt==='morning')wo=wake+20;else if(p.wt==='after'&&workDay)wo=work[1]+30;else wo=Math.max(wake+60,sleep-240)}
  let bf=wake+30;if(wo!=null&&p.wt==='morning')bf=wo+(strong?50:45);

  A(wake,'Подъём, стакан воды','x','wake');
  if(workDay)A(work[0],'Работа / учёба до '+hm(work[1]),'info');
  const ms=S.plan.meals,nm=ms.length,last=nm>=6?Math.min(sleep-90,Math.max(dinner+120,sleep-120)):dinner,
    lastMain=nm>=6?nm-2:nm-1,anc={0:bf};anc[lastMain]=dinner;if(nm>=6)anc[nm-1]=last;
  const li=ms.findIndex(e=>e.n==='Обед');if(li>0&&li<lastMain)anc[li]=lunch;
  const ks=Object.keys(anc).map(Number).sort((a,b)=>a-b);
  ms.forEach((e,i)=>{let t;if(nm===1)t=lunch;else if(anc[i]!=null)t=anc[i];else{const a=ks.filter(k=>k<i).pop(),b=ks.find(k=>k>i);t=anc[a]+(anc[b]-anc[a])*(i-a)/(b-a)}
    A(t,e.n,'meal',e.id)});
  if(wo!=null)A(wo,strong?'Тренировка':ex.map(e=>e.n).join(' + '),'wo');
  A(sleep-30,'Телефон в сторону, свет потише','x','screen');
  A(sleep,'Отбой','x','sleep');
  return out.sort((a,b)=>a.m-b.m);
}

  if(W.s+1<x.sets){W.s++;W.ph='rest';W.end=Date.now()+REST()*1000}
  else{L(cur).x[x.e.id]=1;touch();checkBadges();persist();W.i++;W.s=0;
    if(W.i>=W.list.length){W.ph='rate';beep(660,.15);setTimeout(()=>beep(990,.3),180)}
    else if(x.sec>=120||x.sets<2)W.ph='ready';
    else{W.ph='rest';W.end=Date.now()+Math.round(REST()*.75)*1000}}
  lastS=-1;woDraw();
}
function woTick(){
  if(!W||W.pause||(W.ph!=='work'&&W.ph!=='rest'))return;
  const left=Math.max(0,W.end-Date.now()),sec=Math.ceil(left/1000),n=$('#woN');if(n)n.textContent=fmt(sec);
  if(sec!==lastS&&sec<=3&&sec>0)beep(520,.1);lastS=sec;
  if(left<=0){beep(990,.35);lastS=-1;if(W.ph==='work')woDone();else{W.ph='ready';woDraw()}}
}
function woDraw(){
  const b=$('#wob');if(!W)return;

  }else{

    if(x.sec){const left=W.ph==='work'?(W.pause?Math.ceil(W.pause/1000):Math.ceil((W.end-Date.now())/1000)):x.sec;
      mid+=`<div class="wbig" id="woN">${fmt(left)}</div>${x.note?`<p class="wl">${esc(x.note)}</p>`:''}`;
      btns=W.ph==='work'?`<button class="btn ghostw" data-wa="pause">${W.pause?'Продолжить':'Пауза'}</button><button class="btn" data-wa="done">Готово</button>`:`<button class="btn" data-wa="go">Старт</button><button class="btn ghostw" data-wa="next">Пропустить</button>`}
    else if(x.reps){mid+=`<div class="wbig">${x.reps}</div><p class="wl">повторов${x.note?' '+esc(x.note):''}</p>`;btns=`<button class="btn" data-wa="done">Сделал подход</button><button class="btn ghostw" data-wa="next">Пропустить</button>`}
    else{mid+=`<p class="wl">${esc(x.note||'Выполни упражнение')}</p>`;btns=`<button class="btn" data-wa="done">Готово</button>`}

}

function advice(){
  const from=key(add(new Date(),-14)),after=S.plan.advAt||'';
  const r=Object.keys(S.log).filter(k=>S.log[k].r&&k>=from&&k>after).sort().reverse().slice(0,3).map(k=>S.log[k].r);
  if(r.length>=2&&r.filter(v=>v===1).length>=2&&stageOf(TODAY())<3)return{t:'fast',m:'Последние тренировки даются легко — можно перейти на следующий этап.'};
  if(r.length>=2&&r.filter(v=>v===3).length>=2&&weekOf(TODAY())>0)return{t:'slow',m:'Последние тренировки были тяжёлыми — лучше повторить неделю. Это нормально.'};
  return null;
}
const advHtml=()=>{const a=advice();return a?`<div class="nb">${a.m} <button class="btn" data-sh="${a.t}">${a.t==='fast'?'Перейти на этап':'Повторить неделю'}</button></div>`:''};
function shift(t){const s0=parse(S.plan.start),w=weekOf(TODAY());
  if(t==='slow')S.plan.start=key(add(s0,7));else if(t==='fast')S.plan.start=key(add(s0,-((Math.min(3,Math.floor(w/2))+1)*2-w)*7));else S.plan.start=TODAY();
  S.plan.advAt=TODAY();changed();toast(t==='slow'?'Неделя повторяется — нагрузка чуть ниже.':t==='fast'?'Новый этап: «'+STAGES[stageOf(TODAY())]+'»':'Программа началась заново.')}

function earned(){
  const ks=Object.keys(S.log).sort(),got=new Set(),weeks={};let wo=0,run=0,p7=null,best=0,wr=0,pw=null,wb=0;
  const strongN=Object.values(S.plan.days).filter(a=>a.length>2).length;
  for(const k of ks){const l=S.log[k],dw=parse(k).getDay(),ex=S.plan.days[dw]||[],done=ex.length>0&&ex.every(e=>l.x[e.id]);
    if(done)wo++;
    if(done&&ex.length>2){const mon=key(add(parse(k),-((dw+6)%7)));weeks[mon]=(weeks[mon]||0)+1}
    if(score(k).p>=.7){run=p7&&key(add(parse(p7),1))===k?run+1:1;p7=k;best=Math.max(best,run)}
    if(l.w>=S.plan.water){wr=pw&&key(add(parse(pw),1))===k?wr+1:1;pw=k;wb=Math.max(wb,wr)}}
  [[1,'wo1'],[10,'wo10'],[25,'wo25'],[50,'wo50']].forEach(([n,id])=>{if(wo>=n)got.add(id)});
  [[3,'s3'],[7,'s7'],[30,'s30'],[100,'s100']].forEach(([n,id])=>{if(best>=n)got.add(id)});
  if(strongN&&Object.values(weeks).some(v=>v>=strongN))got.add('week');
  if(wb>=7)got.add('water7');
  const st=stageOf(TODAY());if(st>=1)got.add('st2');if(st>=3)got.add('st4');
  const kg=ks.map(k=>parseFloat(S.log[k].kg)).filter(v=>v>0);
  if(kg.length>1&&S.prof){const d=kg[kg.length-1]-kg[0];if((S.prof.goal==='lose'&&d<=-1)||(S.prof.goal==='gain'&&d>=1))got.add('kg1')}
  return got;
}

function xpTotal(){let x=0;const g=stepsGoal();
  for(const k in S.log){const l=S.log[k],ex=S.plan.days[parse(k).getDay()]||[];
    x+=Object.keys(l.x||{}).length*10;if(ex.length&&ex.every(e=>l.x[e.id]))x+=30;
    x+=Object.keys(l.m||{}).length*5+Object.keys(l.h||{}).length*5;if(l.w>=S.plan.water)x+=10;
    if(slH(l.sl)!=null)x+=5;if(l.st>=g)x+=10;if(l.r)x+=5}
  x+=Object.keys(S.badges||{}).length*100;
  for(const id in(S.rec||{})){let b=-1;for(const r of S.rec[id]){x+=10;if(r.v>b){if(b>=0)x+=50;b=r.v}}}
  return x}
const need=n=>50*n*(n-1);
function lvl(x){let n=1;while(x>=need(n+1))n++;return{n,cur:x-need(n),span:need(n+1)-need(n),name:n<=LVN.length?LVN[n-1]:LVN[LVN.length-1]+' '+(n-LVN.length+1)}}
function renderLv(){const v=lvl(xpTotal());$('#lv').innerHTML=`<span class="lvn">Ур. ${v.n}</span><span class="lvt"><span>${v.name}</span><i><b style="width:${Math.round(v.cur/v.span*100)}%"></b></i><small>${v.cur} / ${v.span} XP</small></span>`}
function checkLevel(){const v=lvl(xpTotal());if(S.lvl&&v.n>S.lvl){const t=$('#toast'),go=()=>toast(`Новый уровень ${v.n}: «${v.name}»!`);t.hidden?go():setTimeout(go,4100)}S.lvl=v.n}

const IN_CLAUDE=typeof window.claude!=='undefined';
const SVK='forma-server';
const SV=()=>{try{return JSON.parse(localStorage.getItem(SVK)||'null')}catch(e){return null}};
let syncT=null,syncing=false,syncMsg='';
function setSync(m){syncMsg=m;const e=$('#svst');if(e)e.textContent=m}
async function api(p,b){const c=SV();if(!c||!c.url)throw Error('Сервер не указан');
  const r=await fetch(c.url.replace(/\/+$/,'')+p,{method:b?'POST':'GET',headers:{'Authorization':'Bearer '+c.key,'Content-Type':'application/json','ngrok-skip-browser-warning':'1'},body:b?JSON.stringify(b):undefined});
  if(r.status===401)throw Error('неверный ключ');if(!r.ok)throw Error('сервер ответил '+r.status);return r.json()}
function buildRem(){const out=[],t=new Date();if(!S.prof)return out;const n=NUT(),sh=mealShares();
  for(let dd=0;dd<2;dd++){const d=add(t,dd),k=key(d),base=new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime(),ex=S.plan.days[d.getDay()]||[],at=m=>base+Math.round(m)*60000;
    for(const it of SCHED(k)){
      if(it.kind==='wo'){const ids=ex.map(e=>e.id);
        out.push({id:k+'|wo|pre',at:at(it.m-30),title:'Через 30 минут — '+(ex.length>2?'тренировка':it.n.toLowerCase()),body:ex.map(e=>e.n).slice(0,4).join(', '),chk:{d:k,k:'wo',ids}});
        out.push({id:k+'|wo|late',at:at(it.m+120),title:'Тренировка ещё не отмечена',body:'Сделал — отметь. Нет — ещё не поздно хотя бы на 10 минут.',chk:{d:k,k:'wo',ids}})}
      else if(it.kind==='meal')out.push({id:k+'|m|'+it.id,at:at(it.m),title:it.n+' · '+hm(it.m),body:n?`≈${fmtN(Math.round(n.kcal*sh[it.id]/10)*10)} ккал · ${plate(n,sh[it.id])}`:'Пора поесть — и отметь в приложении',chk:{d:k,k:'m',id:it.id}});
      else if(it.id==='screen')out.push({id:k+'|x|screen',at:at(it.m),title:'Через 30 минут отбой',body:'Телефон в сторону, свет потише.',chk:{d:k,k:'x',id:'screen'}})}
    const p=S.prof;if(p.sleep&&p.wake){let sl=tm(p.sleep);if(sl<=tm(p.wake))sl+=1440;out.push({id:k+'|water',at:at(sl-150),title:'Как с водой?',body:`Норма — ${S.plan.water} стаканов. Отметь, сколько выпил.`,chk:{d:k,k:'w',n:S.plan.water}})}}
  return out.filter(r=>r.at>Date.now()-60000)}
function queueSync(){if(!SV())return;clearTimeout(syncT);syncT=setTimeout(syncNow,1500)}
async function syncNow(){const c=SV();if(!c||!c.url)return;if(syncing){queueSync();return}syncing=true;
  try{if((S.ui||{}).push)S.rem=buildRem();const before=JSON.stringify(S);
    const r=await api('/api/sync',{state:S});
    if(r&&r.state&&r.state.log&&JSON.stringify(S)===before){const after=JSON.stringify(r.state);
      if(after!==before){S=r.state;migrate();try{localStorage.setItem(LS,after)}catch(e){}render()}}
    else queueSync();
    setSync('Синхронизировано в '+hm(new Date().getHours()*60+new Date().getMinutes()))}
  catch(e){setSync('Нет связи с сервером: '+e.message+'. Данные сохранены на телефоне.')}
  finally{syncing=false}}
const b64u=s=>{const b=atob((s+'='.repeat((4-s.length%4)%4)).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(b,c=>c.charCodeAt(0))};
async function enablePush(){
  if(!('serviceWorker' in navigator)||!('PushManager' in window)||!('Notification' in window))throw Error('этот браузер не умеет уведомления — открой приложение в Chrome');
  if(await Notification.requestPermission()!=='granted')throw Error('уведомления запрещены — разреши их в настройках Chrome для сайта');
  const{key}=await api('/api/vapid');if(!key)throw Error('на сервере не установлен web-push');
  const reg=await navigator.serviceWorker.ready;let sub=await reg.pushManager.getSubscription();
  if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(key)});
  await api('/api/subscribe',{sub:sub.toJSON()});S.ui=Object.assign({},S.ui,{push:true});persist();await syncNow()}
const svCard=()=>{if(IN_CLAUDE)return'';const c=SV()||{};return `<div class="card"><h3>Свой сервер</h3>
  <p class="muted" style="margin-top:0">Синхронизация с ПК, уведомления и копии данных через старый телефон. Как настроить — в инструкции от Claude.</p>
  <label class="lb">Адрес сервера<input type="url" id="svu" placeholder="https://имя.ngrok-free.app" value="${esc(c.url||'')}" autocomplete="off"></label>
  <label class="lb" style="margin-top:8px">Ключ<input type="password" id="svk" value="${esc(c.key||'')}" autocomplete="off"></label>
  <div class="row" style="margin-top:10px"><button class="btn" id="svgo">${c.url?'Сохранить и проверить':'Подключить'}</button>${c.url?'<button class="btn ghost" id="svoff">Отключить</button>':''}</div>
  ${c.url?`<div class="row" style="margin-top:8px"><button class="btn ghost" id="svpush">${(S.ui||{}).push?'Обновить уведомления':'Включить уведомления'}</button><button class="btn ghost" id="svtest">Тест</button>${(S.ui||{}).push?'<button class="btn ghost" id="svpoff">Выключить</button>':''}</div>`:''}
  <p class="muted" id="svst">${esc(syncMsg)}</p></div>`};
document.addEventListener('click',async e=>{const t=e.target.closest('#svgo,#svoff,#svpush,#svtest,#svpoff');if(!t)return;
  try{
    if(t.id==='svgo'){let u=$('#svu').value.trim();const k=$('#svk').value.trim();if(!u||!k){setSync('Впиши адрес и ключ.');return}
      if(!/^https?:\/\//.test(u))u='https://'+u;localStorage.setItem(SVK,JSON.stringify({url:u,key:k}));setSync('Проверяю…');await syncNow();renderMe();return}
    if(t.id==='svoff'){localStorage.removeItem(SVK);syncMsg='Сервер отключён. Данные остались на телефоне.';renderMe();return}
    if(t.id==='svpush'){setSync('Включаю…');await enablePush();renderMe();toast('Уведомления включены. Нажми «Тест», чтобы проверить.');return}
    if(t.id==='svpoff'){S.ui=Object.assign({},S.ui,{push:false});S.rem=[];persist();await syncNow();renderMe();toast('Уведомления выключены');return}
    if(t.id==='svtest'){const r=await api('/api/test',{});toast(r.sent?'Отправлено — уведомление придёт через пару секунд':'Нет подписанных устройств — сначала «Включить уведомления»');return}
  }catch(er){setSync('Не получилось: '+er.message)}});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')syncNow()});
setInterval(()=>{if(document.visibilityState==='visible')syncNow()},120000);

render();
if(SV())syncNow();

(async()=>{
  try{
    const[d,u]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!d||!u)return;
    const id=await u.id();if(!id)return;
    db=d;ref=db.collection('data/users/'+id).doc('tracker');
    const snap=await ref.get();
    const data=snap&&typeof snap.data==='function'?snap.data():snap;
    if(data&&data.json){S=JSON.parse(data.json);migrate();checkBadges(true);try{localStorage.setItem(LS,data.json)}catch(e){}render()}
    else persist();
    $('#save').textContent='Синхронизировано с аккаунтом ✓';
  }catch(e){$('#save').textContent='Сохраняется на этом устройстве'}
})();
}
