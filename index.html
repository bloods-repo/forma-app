<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Форма.дома</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0b0d12;--card:#141821;--card2:#1b2030;--line:#262c3d;--ink:#f3f4f8;--mut:#8f97ad;--acc:#ff7a59;--acc2:#ffb35c;--done:#5ee6a8;--accInk:#1a0d06;--miss:#ff5d73;--r:22px;--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.56,.64,1)}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Manrope,system-ui,sans-serif;overflow-x:clip}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:8px}
.num{font-variant-numeric:tabular-nums;font-weight:800;letter-spacing:-.02em}
.app{max-width:480px;margin:0 auto;padding:0 16px calc(110px + env(safe-area-inset-bottom));position:relative}
/* шапка */
header.hd{display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 0 10px;position:sticky;top:0;z-index:20;background:linear-gradient(var(--bg) 70%,transparent)}
.hd .who{flex:1}.hd small{color:var(--mut);font-size:13px;display:block}.hd b{font-size:20px;font-weight:800;letter-spacing:-.01em}
.lv{position:relative;width:46px;height:46px;display:grid;place-items:center}
.lv svg{position:absolute;inset:0;transform:rotate(-90deg)}.lv span{font-weight:800;font-size:15px}
.lv circle{fill:none;stroke-width:4}.lv .t{stroke:var(--line)}.lv .p{stroke:var(--acc);stroke-linecap:round;transition:stroke-dashoffset .8s var(--ease)}
/* небо и дуга */
.sky{position:relative;border-radius:28px;overflow:hidden;padding:18px 16px 18px;margin-top:4px;isolation:isolate;transition:background 1s}
.sky::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 120%,#0006,transparent 60%);z-index:-1}
.stars{position:absolute;inset:0;z-index:-1;opacity:var(--stars,0);background-image:radial-gradient(1px 1px at 20% 30%,#fff9,transparent),radial-gradient(1px 1px at 70% 20%,#fff8,transparent),radial-gradient(1.5px 1.5px at 85% 55%,#fffa,transparent),radial-gradient(1px 1px at 40% 60%,#fff7,transparent),radial-gradient(1px 1px at 10% 70%,#fff6,transparent),radial-gradient(1px 1px at 55% 40%,#fff8,transparent)}
.sky .top{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:#ffffffcc}
.sky .top b{font-size:15px;color:#fff;font-weight:700}
.arc{display:block;width:100%;height:auto;overflow:visible;margin-top:2px}
.arc .path{fill:none;stroke:#ffffff40;stroke-width:2;stroke-dasharray:2 6;stroke-linecap:round}
.arc .lit{fill:none;stroke:#ffffffd0;stroke-width:3;stroke-linecap:round}
.arc .dot{transition:transform .5s var(--spring);transform-box:fill-box;transform-origin:center}
.arc .dot.pop{animation:pop .6s var(--spring)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.8)}100%{transform:scale(1)}}
.sun{filter:drop-shadow(0 0 10px #fff) drop-shadow(0 0 22px #ffd27a)}
.sun circle{animation:sunp 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes sunp{50%{transform:scale(1.15)}}
.pc{position:absolute;left:0;right:0;bottom:22px;text-align:center;pointer-events:none}
.pc .num{font-size:52px;line-height:1;color:#fff;display:block}.pc small{color:#ffffffcc;font-size:14px}
.ends{display:flex;justify-content:space-between;font-size:12px;color:#ffffffaa;margin-top:-4px}
/* карточка сейчас */
.now{margin-top:16px;background:var(--card);border-radius:var(--r);padding:18px;position:relative;overflow:hidden;border:1px solid var(--line)}
.now .tag{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:700;color:var(--acc);background:color-mix(in srgb,var(--acc) 15%,transparent);padding:4px 10px;border-radius:999px}
.now .tag.miss{color:var(--miss);background:#ff5d7322}.now .tag.ok{color:var(--done);background:color-mix(in srgb,var(--done) 15%,transparent)}
.now h2{font-size:28px;line-height:1.1;margin:10px 0 4px;font-weight:800;letter-spacing:-.02em}
.now p{margin:0;color:var(--mut)}
.now .meta{display:flex;gap:16px;margin:14px 0 16px;flex-wrap:wrap}.now .meta div{display:grid}.now .meta b{font-size:20px}.now .meta small{color:var(--mut);font-size:12px}
.hold{position:relative;width:100%;height:60px;border-radius:18px;background:var(--card2);overflow:hidden;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;gap:10px;user-select:none;-webkit-user-select:none;touch-action:none}
.hold i{position:absolute;inset:0;background:linear-gradient(90deg,var(--acc),var(--acc2));transform-origin:left;transform:scaleX(0)}
.hold span{position:relative}
.hold.go i{transform:scaleX(1);transition:transform .7s linear}
.hold.done i{background:var(--done);transform:scaleX(1)}
.hold.done{color:#062b1a}.hold.go span{color:var(--accInk)}
.row2{display:flex;gap:10px;margin-top:10px}.row2 button{flex:1;height:44px;border-radius:14px;background:var(--card2);color:var(--mut);font-weight:700;font-size:14px}
.cardout{animation:out .45s var(--ease) forwards}.cardin{animation:in .55s var(--spring)}
@keyframes out{to{transform:translateX(-30%) scale(.92);opacity:0}}
@keyframes in{from{transform:translateX(30%) scale(.92);opacity:0}}
/* дальше */
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:24px 2px 10px}.sec h3{margin:0;font-size:18px;font-weight:800}.sec small{color:var(--mut);font-size:13px}
.list{display:grid;gap:8px}
.it{position:relative;border-radius:18px;overflow:hidden;background:var(--done)}
.it .bgl{position:absolute;inset:0;display:flex;align-items:center;padding-left:20px;color:#062b1a;font-weight:800;font-size:14px}
.it .fg{position:relative;display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:18px;touch-action:pan-y;transition:transform .35s var(--ease)}
.it .fg.drag{transition:none}
.it .ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;font-weight:800;font-size:13px}
.it .tx{flex:1}.it .tx b{display:block;font-weight:700}.it .tx small{color:var(--mut);font-size:13px}
.it .tm{font-weight:700;color:var(--mut);font-variant-numeric:tabular-nums}
.it.isdone{background:none}.it.isdone .bgl{display:none}.it.isdone .fg{opacity:.5}.it.isdone .tx b{text-decoration:line-through;text-decoration-color:#fff6}
.it.isdone .tm::before{content:"✓ ";color:var(--done)}
.hint{font-size:12px;color:var(--mut);text-align:center;margin-top:8px}
/* плитки */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;position:relative;overflow:hidden;min-height:118px;text-align:left;display:flex;flex-direction:column}
.tile small{color:var(--mut);font-size:13px;font-weight:600}.tile .num{font-size:30px;margin-top:auto;position:relative}.tile .num em{font-style:normal;font-size:14px;color:var(--mut);font-weight:600}
.wave{position:absolute;left:0;right:0;bottom:0;height:var(--h,0%);transition:height .7s var(--spring);background:linear-gradient(#4aa8ff55,#4aa8ff22)}
.wave svg{position:absolute;left:0;top:-10px;width:200%;height:12px;animation:wv 3s linear infinite}
@keyframes wv{to{transform:translateX(-50%)}}
.tile .bar{height:8px;border-radius:4px;background:var(--line);margin-top:8px;overflow:hidden}.tile .bar i{display:block;height:100%;background:var(--acc);border-radius:4px;transition:width .8s var(--ease)}
.plus{position:absolute;right:12px;top:12px;width:32px;height:32px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-size:20px;font-weight:600}
/* таб-бар */
.tb{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(448px,calc(100% - 24px));z-index:30;display:grid;grid-template-columns:1fr 1fr 76px 1fr 1fr;align-items:center;padding:8px;border-radius:26px;background:#141821e6;-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--line);box-shadow:0 16px 40px -12px #000a}
.tb>button{display:grid;justify-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--mut);padding:6px 0;transition:color .2s}
.tb>button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s var(--spring)}
.tb>button.on{color:var(--ink)}.tb>button.on svg{transform:translateY(-2px)}
.tb>button.on::after{content:"";width:4px;height:4px;border-radius:50%;background:var(--acc)}
.fab{width:64px;height:64px;margin:-30px auto 0;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;box-shadow:0 10px 26px -6px var(--acc),0 0 0 6px var(--bg);transition:transform .2s var(--spring)}
.fab:active{transform:scale(.92)}.fab svg{width:26px;height:26px;fill:var(--accInk)}
/* экраны */
.scr{display:none}.scr.on{display:block;animation:scr .45s var(--ease)}
.scr.on.l{animation-name:scrl}
@keyframes scr{from{opacity:0;transform:translateX(24px)}}@keyframes scrl{from{opacity:0;transform:translateX(-24px)}}
.ttl{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:8px 2px 14px}
/* питание */
.rings{display:flex;align-items:center;gap:18px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.rings svg{width:132px;height:132px;flex:none;transform:rotate(-90deg)}
.rings circle{fill:none;stroke-width:11;stroke-linecap:round;transition:stroke-dashoffset 1.1s var(--ease)}
.legend{display:grid;gap:10px;flex:1}.legend div{display:grid;grid-template-columns:10px 1fr;column-gap:8px;align-items:baseline}
.legend i{width:10px;height:10px;border-radius:50%;margin-top:4px}.legend b{font-size:18px}.legend small{grid-column:2;color:var(--mut);font-size:12px}
.car{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 6px;margin:0 -16px;padding-inline:16px;scrollbar-width:none}
.car::-webkit-scrollbar{display:none}
.rc{flex:0 0 74%;scroll-snap-align:start;border-radius:var(--r);padding:16px;min-height:170px;display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden}
.rc b{font-size:18px;line-height:1.15}.rc small{opacity:.85;font-size:13px;margin-top:4px}
.rc .big{position:absolute;right:-10px;top:-18px;font-size:110px;font-weight:800;opacity:.14;line-height:1}
/* прогресс (старое) */
.lvl{background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 38%,#13172a),#13172a);border-radius:var(--r);padding:18px;display:flex;gap:16px;align-items:center;border:1px solid color-mix(in srgb,var(--acc) 40%,transparent)}
.lvl .bn{width:76px;height:76px;border-radius:24px;background:#ffffff14;display:grid;place-items:center;font-size:36px}
.lvl b{font-size:20px;display:block}.lvl small{color:#c9c5e8;font-size:13px}
.xpb{height:10px;border-radius:5px;background:#ffffff1f;margin:8px 0 4px;overflow:hidden}.xpb i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:5px;transition:width 1s var(--ease)}
.st3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:10px}
.st3 div{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px}.st3 .num{font-size:26px;display:block}.st3 small{color:var(--mut);font-size:12px}
.heat{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.heat i{aspect-ratio:1;border-radius:7px;background:var(--line)}
.heat i.t{outline:2px solid var(--acc);outline-offset:1px}
/* профиль */
.grp{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.grp div{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-top:1px solid var(--line);min-height:52px}.grp div:first-child{border-top:0}
.grp span{color:var(--mut)}
.pals{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.pals button{aspect-ratio:1;border-radius:20px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;position:relative;transition:transform .25s var(--spring)}
.pals button:active{transform:scale(.92)}
.pals i{width:46%;aspect-ratio:1;border-radius:50%;background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 6px 18px -6px var(--a)}
.pals button.on{border:2px solid var(--a)}.pals button.on::after{content:"";position:absolute;right:8px;top:8px;width:8px;height:8px;border-radius:50%;background:var(--a)}
.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px}
.seg button{height:42px;border-radius:12px;font-weight:700;font-size:14px;color:var(--mut)}.seg button.on{background:var(--card2);color:var(--ink)}
/* тренировка: полноэкранная */
.wo{position:fixed;inset:0;z-index:50;background:radial-gradient(120% 80% at 50% 0%,color-mix(in srgb,var(--acc) 28%,#0b0d12),var(--bg) 60%);display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom));clip-path:circle(0 at var(--cx,50%) var(--cy,100%));transition:clip-path .6s var(--ease);visibility:hidden}
.wo.open{clip-path:circle(150% at var(--cx,50%) var(--cy,100%));visibility:visible}
.wo .segs{display:flex;gap:4px}.wo .segs i{flex:1;height:4px;border-radius:2px;background:#ffffff26;overflow:hidden}.wo .segs i b{display:block;height:100%;width:0;background:#fff;transition:width .5s var(--ease)}
.wo .wt{display:flex;justify-content:space-between;align-items:center;margin-top:14px;color:#ffffffb0;font-size:14px}
.wo .x{width:40px;height:40px;border-radius:50%;background:#ffffff14;font-size:22px}
.wo .ex{margin-top:auto;margin-bottom:auto;text-align:center}
.wo .ex small{color:var(--acc);font-weight:800;letter-spacing:.06em;font-size:12px;text-transform:uppercase}
.wo .ex h2{font-size:34px;margin:8px 0;font-weight:800;letter-spacing:-.02em}
.wo .ex .num.big{font-size:120px;line-height:1;display:block}
.wo .ex p{color:#ffffffb0;margin:6px 0 0}
.rest{position:relative;width:min(240px,60vw);aspect-ratio:1;margin:18px auto 8px}.rest svg{width:100%;height:100%;transform:rotate(-90deg)}
.rest circle{fill:none;stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset .1s linear}.rest .num{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(44px,14vw,60px);line-height:1}
.wo .acts{display:grid;gap:10px}
.wo .acts .hold{background:#ffffff14;color:#fff}
.wo .acts .sec2{height:48px;border-radius:16px;background:#ffffff0d;color:#ffffffb0;font-weight:700}
.wrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}.wrow3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.wbtn{height:56px;border-radius:18px;background:#ffffff14;color:#fff;font-weight:800;font-size:16px;transition:transform .15s var(--spring)}.wbtn:active{transform:scale(.96)}
.wbtn.pri{background:linear-gradient(90deg,var(--acc),var(--acc2));color:var(--accInk)}.wbtn.big{height:64px;font-size:18px}
.wclk{font-size:17px;color:#fff}.wtb{display:flex;gap:8px}.wo .x{display:grid;place-items:center}.wo .x svg{width:18px;height:18px;stroke:#fff;stroke-width:2.6;stroke-linecap:round;fill:none}
.wo.paused .ex h2,.wo.paused .ex .num{opacity:.45;transition:opacity .3s}.wo.paused .ex small{color:#fff}

/* эффекты */
#fx{position:fixed;inset:0;pointer-events:none;z-index:80}
.rip{position:absolute;width:160px;height:160px;margin:-80px 0 0 -80px;border-radius:50%;border:2px solid var(--c,#5ee6a8);pointer-events:none}
.bigw{position:fixed;left:50%;top:50%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;pointer-events:none;box-shadow:0 0 0 2px var(--c,#5ee6a8),0 0 60px 10px var(--c,#5ee6a8)}
.flash{position:fixed;inset:0;pointer-events:none;background:radial-gradient(60% 50% at 50% 50%,var(--c,#5ee6a8),transparent 70%)}
.shine{position:relative}.shine::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(105deg,transparent 30%,#ffffff40 50%,transparent 70%);background-size:250% 100%;animation:shine .8s ease-out}
@keyframes shine{from{background-position:120% 0}to{background-position:-60% 0}}
.lv.pulse{animation:lvp .9s var(--spring)}@keyframes lvp{40%{transform:scale(1.3)}}
.snd{width:40px;height:40px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center}
.snd svg{width:20px;height:20px;fill:none;stroke:var(--mut);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.xp{position:absolute;font-weight:800;color:var(--acc);font-size:16px;white-space:nowrap}
.toast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;background:#f3f4f8;color:#0b0d12;padding:12px 18px;border-radius:16px;font-weight:700;z-index:60;transition:all .4s var(--spring);white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}


/* живая сцена неба */
.scene{position:absolute;inset:0;z-index:-1;pointer-events:none;overflow:hidden;border-radius:inherit}
.scene>i,.clouds{position:absolute}
.moon{right:24%;top:24%;width:30px;height:30px;border-radius:50%;box-shadow:inset -9px 3px 0 0 #f6f1dc,0 0 26px 4px #f6f1dc33;opacity:var(--night,0);transform:rotate(-20deg);transition:opacity 1s}
.glow{left:-10%;right:-10%;bottom:-30%;height:70%;background:radial-gradient(50% 60% at var(--gx,50%) 100%,var(--gc,#ff9a62),transparent 70%);opacity:var(--dusk,0);transition:opacity 1s}
.hills{position:absolute;left:0;right:0;bottom:0;width:100%;height:28%}
.hills .h1{fill:var(--h1,#1a1840)}.hills .h2{fill:var(--h2,#100f2a)}
.clouds{inset:0;opacity:var(--cl,0);transition:opacity 1.2s}
.clouds i{position:absolute;height:26px;border-radius:30px;background:var(--cc,#ffffffd0);filter:blur(1.5px);animation:cloud linear infinite}
.clouds i::before,.clouds i::after{content:"";position:absolute;border-radius:50%;background:inherit}
.clouds i::before{width:46%;height:180%;left:16%;bottom:30%}.clouds i::after{width:34%;height:140%;left:50%;bottom:30%}
.clouds i:nth-child(1){top:16%;width:90px;animation-duration:70s;animation-delay:-10s}
.clouds i:nth-child(2){top:34%;width:120px;animation-duration:95s;animation-delay:-50s;opacity:.85}
.clouds i:nth-child(3){top:8%;width:70px;animation-duration:60s;animation-delay:-35s;opacity:.7}
.clouds i:nth-child(4){top:46%;width:100px;animation-duration:110s;animation-delay:-80s;opacity:.6}
.clouds i:nth-child(5){top:24%;width:140px;animation-duration:130s;animation-delay:-20s;opacity:.5}
@keyframes cloud{from{transform:translateX(-180px)}to{transform:translateX(560px)}}
.rain{inset:0;opacity:var(--rn,0);transition:opacity 1s}
.rain b{position:absolute;top:-24px;width:1.5px;border-radius:1px;background:linear-gradient(transparent,#d8e6ff99);animation:drop linear infinite}
@keyframes drop{to{transform:translateY(260px)}}
.snow{inset:0;opacity:var(--sn,0);background-image:radial-gradient(2px 2px at 20px 30px,#fff,transparent),radial-gradient(1.5px 1.5px at 80px 70px,#fff,transparent),radial-gradient(2px 2px at 140px 20px,#fffd,transparent),radial-gradient(1.5px 1.5px at 60px 110px,#fff,transparent),radial-gradient(2px 2px at 170px 90px,#fffc,transparent);background-size:190px 130px;animation:snow 9s linear infinite;transition:opacity 1s}
.snow.s2{background-size:130px 110px;animation-duration:14s;opacity:calc(var(--sn,0)*.7)}
@keyframes snow{to{background-position:30px 130px}}
.fog{left:0;right:0;bottom:0;height:70%;background:linear-gradient(transparent,#d9e2f0aa 70%);opacity:var(--fg,0);transition:opacity 1s}
.bolt{inset:0;background:#fff;opacity:0}.sky[data-wx=storm] .bolt{animation:bolt 7s infinite}
@keyframes bolt{0%,88%,92%,96%,100%{opacity:0}89%,93%{opacity:.55}}
.scene::after{content:"";position:absolute;inset:0;background:#5b6475;opacity:var(--tint,0);mix-blend-mode:saturation;pointer-events:none}

<script>
{

let uid=0;const nid=()=>Date.now().toString(36)+(uid++);

const P=(n,...s)=>({id:nid(),n,s});
const STAGES=['Знакомство','Привыкание','Укрепление','Уверенный старт'];
const tk=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const warm=()=>P('Разминка: суставы + ходьба на месте','5 мин','5 мин','7 мин','7 мин');

const DEF={plan:{ver:2,start:tk(),
  days:{
    1:[warm(),P('Приседания','к стулу · 2×8','к стулу · 2×12','3×12','3×15'),P('Отжимания','от стены · 2×8','от стены · 3×10','от стола · 3×8','с колен · 3×10'),P('Ягодичный мост','2×10','3×10','3×15','3×20'),P('Планка','на коленях · 2×15 с','2×20 с','3×25 с','3×35 с'),cool()],
    2:[P('Быстрая ходьба','20 мин','25 мин','30 мин','35 мин'),P('Растяжка','5 мин','5 мин','10 мин','10 мин')],
    3:[warm(),P('Выпады назад','у опоры · 2×5 на ногу','у опоры · 2×8','3×8','3×10'),P('Отжимания','от стены · 2×8','от стены · 3×10','от стола · 3×8','с колен · 3×10'),P('Птица-собака','2×6 на сторону','2×8','3×8','3×10'),P('Супермен','2×8','2×10','3×10','3×12'),cool()],
    4:[P('Быстрая ходьба','20 мин','25 мин','30 мин','35 мин'),P('Растяжка','5 мин','5 мин','10 мин','10 мин')],
    5:[warm(),P('Приседания','к стулу · 2×8','к стулу · 2×12','3×12','3×15'),P('Подъёмы на носки','2×10','2×15','3×15','3×20'),P('Отжимания','от стены · 2×8','от стены · 3×10','от стола · 3×8','с колен · 3×10'),P('Скручивания лёжа','2×8','2×12','3×12','3×15'),P('Планка','на коленях · 2×15 с','2×20 с','3×25 с','3×35 с'),cool()],
    6:[P('Прогулка','30 мин','35 мин','40 мин','45 мин')],
    0:[]},
  meals:[X('Завтрак','белок + каша'),X('Обед','мясо/рыба + овощи'),X('Перекус','фрукт или йогурт'),X('Ужин','лёгкий, за 3 ч до сна')],
  habits:[X('Без сладкого'),X('Сон 7+ часов'),X('8 000+ шагов')],
  water:8},log:{}};
const migrate=()=>{if(!S.plan||S.plan.ver!==2){S.plan=JSON.parse(JSON.stringify(DEF.plan));S.log=S.log||{}}};
// решение сервера по итогам недели: сдвиг этапа (применяется один раз)
function applyAuto(){const a=S.auto;if(!a||!a.u||a.u<=(S.plan.autoU||0))return false;
  if(a.delta){const[y,m,d]=S.plan.start.split('-').map(Number),x=new Date(y,m-1,d+a.delta);S.plan.start=x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}
  S.plan.autoU=a.u;S.plan.autoMsg=a.msg||'';return true}

let S=JSON.parse(JSON.stringify(DEF));
const LS='forma-doma-v1';
try{const v=localStorage.getItem(LS);if(v)S=JSON.parse(v)}catch(e){}
migrate();applyAuto();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const key=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const parse=k=>{const[a,b,c]=k.split('-').map(Number);return new Date(a,b-1,c)};
const add=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
// граница дня: после отбоя + 3 ч (но не позже чем за 30 мин до подъёма); без профиля — полночь
function cutM(){const p=S&&S.prof;if(!p||!p.wake||!p.sleep)return 0;const t=x=>{const[a,b]=String(x).split(':').map(Number);return(a||0)*60+(b||0)};
  const w=t(p.wake);let s=t(p.sleep);if(s<=w)s+=1440;return Math.max(0,Math.min(Math.max(s-1440,0)+180,w-30))}
const TODAY=()=>{const d=new Date(),c=cutM();if(d.getHours()*60+d.getMinutes()<c)d.setDate(d.getDate()-1);return key(d)};
let cur=TODAY(),view='today',planDay=parse(TODAY()).getDay();

const DAY=864e5;
const weekOf=k=>Math.max(0,Math.floor((parse(k)-parse(S.plan.start))/DAY/7));
const stageOf=k=>Math.min(3,Math.floor(weekOf(k)/2));
const dose=(e,k)=>e.s?e.s[stageOf(k)]:e.d;
const L=k=>S.log[k]||(S.log[k]={x:{},m:{},h:{},w:0,kg:''});
const Lr=k=>S.log[k]||{x:{},m:{},h:{},w:0,kg:''};
function score(k){
  const l=Lr(k),dw=parse(k).getDay(),ex=S.plan.days[dw]||[];
  let tot=ex.length+S.plan.meals.length+S.plan.habits.length+1,done=0;
  ex.forEach(e=>l.x[e.id]&&done++);S.plan.meals.forEach(e=>l.m[e.id]&&done++);S.plan.habits.forEach(e=>l.h[e.id]&&done++);
  if(l.w>=S.plan.water)done++;
  return{done,tot,p:tot?done/tot:0};
}

const tm=s=>{const[a,b]=String(s||'0:0').split(':').map(Number);return(a||0)*60+(b||0)};
const hm=m=>{m=((Math.round(m/5)*5)%1440+1440)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
const fmtN=v=>Number(v).toLocaleString('ru-RU');
const lastKg=()=>{const ks=Object.keys(S.log).sort().reverse();for(const k of ks){const v=parseFloat(S.log[k].kg);if(v>0)return v}return null};
function curIntake(){const p=S.prof;if(!p)return null;
  if(+p.ck>0)return{v:+p.ck,src:'со слов'};
  if(!p.ps)return null;
  const per={s:400,m:600,l:850,x:1100}[p.ps]||600,ms=S.plan.meals,sh=mealShares();
  let v=0;ms.forEach(e=>{v+=sh[e.id]<.15?200:per});v+={no:0,some:150,day:400}[p.jf]||0;
  return{v:Math.round(v/50)*50,src:'оценка по порциям'}}
function NUT(){
  const p=S.prof;if(!p||!(p.w>0&&p.h>0&&p.age>0))return null;
  const w=lastKg()||+p.w,h=+p.h,a=+p.age,m=p.sex!=='f';
  const bmi=w/((h/100)**2),bmr=10*w+6.25*h-5*a+(m?5:-161);
  const tdee=bmr*({sit:1.375,feet:1.55,hard:1.7}[p.act]||1.375);
  let goalK=p.goal==='lose'?tdee*0.85:p.goal==='gain'?tdee*1.1:tdee;
  goalK=Math.round(Math.max(goalK,m?1500:1200)/50)*50;
  const cur=curIntake(),steps=[];let kcal=goalK;
  if(cur){const STEP=cur.v>goalK?250:200,gap=goalK-cur.v;
    if(Math.abs(gap)>STEP){let v=cur.v;while(Math.abs(goalK-v)>STEP){v+=Math.sign(gap)*STEP;steps.push(Math.round(v/50)*50)}steps.push(goalK);
      const wk=p.at?Math.max(0,Math.floor((parse(TODAY())-parse(p.at))/864e5/7)):0;kcal=steps[Math.min(wk,steps.length-1)]}}
  const base=bmi>=30?25*(h/100)**2:w;
  const prot=Math.round(base*(p.goal==='keep'?1.6:1.8)),fat=Math.round(base*0.9);
  const carb=Math.max(0,Math.round((kcal-prot*4-fat*9)/4));
  const water=Math.max(6,Math.min(14,Math.round(w*30/250)));
  const wk=p.at?Math.max(0,Math.floor((parse(TODAY())-parse(p.at))/864e5/7)):0;
  return{w,bmi,bmr:Math.round(bmr),tdee:Math.round(tdee/50)*50,kcal,goalK,cur,steps,wk,prot,fat,carb,water};
}
const SHARE={'Завтрак':.25,'Обед':.35,'Перекус':.1,'Ужин':.3};
const MEALS=[['Завтрак',1,'белок + каша'],['Второй завтрак',.4,'фрукт или йогурт'],['Обед',1.3,'мясо/рыба + гарнир + овощи'],['Перекус',.4,'творог, фрукт или орехи'],['Ужин',1.1,'белок + овощи'],['Перекус перед сном',.35,'кефир или творог']];
const MW=Object.fromEntries(MEALS.map(m=>[m[0],m[1]]));MW['Полдник']=.4;
function setMealNames(names){const old=S.plan.meals,known=MEALS.map(m=>m[0]);
  const pick=MEALS.filter(m=>names.includes(m[0])).map(([n,,d])=>old.find(x=>x.n===n||(n==='Перекус'&&x.n==='Полдник'))||X(n,d));
  pick.forEach(e=>{if(e.n==='Полдник')e.n='Перекус';delete e.sh});
  const custom=old.filter(x=>!known.includes(x.n)&&x.n!=='Полдник');S.plan.meals=pick.concat(custom)}
function mealShares(){const ms=S.plan.meals,r=ms.map(e=>MW[e.n]??.5),s=r.reduce((a,b)=>a+b,0)||1;return Object.fromEntries(ms.map((e,i)=>[e.id,r[i]/s]))}
const half=x=>{const v=Math.max(.5,Math.round(x*2)/2);return String(v).replace('.5','½').replace(/^0½/,'½')};
function plate(n,sh,long){
  if(sh<.15)return 'фрукт, йогурт или горсть орехов';
  const pr=n.prot*sh,cb=n.carb*sh,ft=n.fat*sh;
  const s=`${half(pr/25)} ладони белка, ${half(cb/30)} горсти гарнира, кулак овощей`;
  return long?s+`, ${half(ft/10)} больш. пальца жира. Белок ≈ ${Math.round(pr)} г — это ~${Math.round(pr/0.3/10)*10} г курицы или ~${Math.round(pr/0.17/10)*10} г творога`:s;
}
function SCHED(k){
  const p=S.prof;if(!p||!p.wake||!p.sleep)return[];
  const dw=parse(k).getDay(),ex=S.plan.days[dw]||[],strong=ex.length>2;
  const wake=tm(p.wake);let sleep=tm(p.sleep);if(sleep<=wake)sleep+=1440;
  let work=null;if(p.wd!=='none'&&p.ws&&p.we){const a=tm(p.ws);let b=tm(p.we);if(b<=a)b+=1440;work=[a,b]}
  const workDay=work&&(p.wd==='all'||(dw>=1&&dw<=5));
  const out=[],A=(m,n,kind,id)=>out.push({m,n,kind,id});
  let wo=null;
  if(ex.length){if(p.wt==='morning')wo=wake+20;else if(p.wt==='after'&&workDay)wo=work[1]+30;else wo=Math.max(wake+60,sleep-240)}
  let bf=wake+30;if(wo!=null&&p.wt==='morning')bf=wo+(strong?50:45);
  let lunch=workDay?work[0]+Math.round((work[1]-work[0])/60)*30:wake+300;if(lunch<bf+180)lunch=bf+180;
  let dinner=sleep-180;if(wo!=null&&wo>lunch&&wo<sleep-120)dinner=Math.max(dinner,Math.min(wo+(strong?75:60),sleep-120));

  A(wake,'Подъём, стакан воды','x','wake');
  if(workDay)A(work[0],'Работа / учёба до '+hm(work[1]),'info');
  const ov=n=>{const e=S.plan.meals.find(x=>x.n===n);if(!e||!e.t)return null;let m=tm(e.t);if(m<wake-60)m+=1440;return m};
  if(ov('Завтрак')!=null)bf=ov('Завтрак');
  if(ov('Обед')!=null){lunch=ov('Обед');if(ov('Ужин')==null)dinner=Math.min(Math.max(dinner,lunch+150),sleep-60)}
  if(ov('Ужин')!=null)dinner=ov('Ужин');
  const hasBf=S.plan.meals.some(x=>x.n==='Завтрак'),hasB2=S.plan.meals.some(x=>x.n==='Второй завтрак'),snk=hasBf&&!hasB2&&lunch-bf>dinner-lunch?(bf+lunch)/2:(lunch+dinner)/2;
  const ms=S.plan.meals,TM={'Завтрак':bf,'Второй завтрак':(bf+lunch)/2,'Обед':lunch,'Перекус':snk,'Полдник':snk,'Ужин':dinner,'Перекус перед сном':Math.min(sleep-90,dinner+120)};
  const tt=ms.map(e=>ov(e.n)??TM[e.n]);
  const ft=ms.map((e,i)=>{let t=tt[i];if(t==null){let a=i-1;while(a>=0&&tt[a]==null)a--;let b=i+1;while(b<ms.length&&tt[b]==null)b++;
      const ta=a>=0?tt[a]:bf,tb=b<ms.length?tt[b]:dinner;t=a>=0&&b<ms.length?(ta+tb)/2:a<0&&b<ms.length?Math.max(wake+30,tb-150):Math.min(sleep-90,ta+150)}return t});
  const notes=[];
  if(wo!=null){const wo0=wo,dur=strong?40:30,big=e=>(MW[e.n]??.5)>=1,gap=e=>big(e)?(strong?120:60):(strong?45:20),fixed=i=>ov(ms[i].n)!=null;
    let ci=-1;for(let k=0;k<4;k++){let mv=false;ms.forEach((e,i)=>{if(fixed(i)&&ft[i]>wo-gap(e)&&ft[i]<wo+dur){wo=ft[i]+gap(e);ci=i;mv=true}});if(!mv)break}
    ms.forEach((e,i)=>{if(fixed(i))return;if(!(ft[i]>wo-gap(e)&&ft[i]<wo+dur))return;
      const others=ft.filter((t,j)=>j!==i),bef=wo-gap(e),aft=wo+dur+20,free=t=>others.every(o=>Math.abs(o-t)>=75);
      if(!big(e)&&free(bef)&&bef>=wake+30)ft[i]=bef;else if(free(aft)&&aft<=sleep-60)ft[i]=aft;else if(free(bef)&&bef>=wake+30)ft[i]=bef;
      else{ft[i]=aft;notes.push(`${e.n} сегодня можно пропустить: между едой и тренировкой для него нет места.`)}});
    if(wo!==wo0){const c=ms[ci];
      notes.push(`${strong?'Тренировку':'Активность'} сдвинул на ${hm(wo)}: ${c?c.n.toLowerCase()+' в '+hm(ft[ci])+' — ':''}${c&&big(c)?(strong?'после плотной еды нужно около 2 часов':'после еды нужен час'):'нужно, чтобы еда улеглась'}.`)}
    if(wo>sleep-120)notes.push('Тренировка поздновато: меньше чем за 2 часа до сна заснуть сложнее. Попробуй поставить еду пораньше.')}
  ms.forEach((e,i)=>A(ft[i],e.n,'meal',e.id));
  if(wo!=null)A(wo,strong?'Тренировка':ex.map(e=>e.n).join(' + '),'wo');
  A(sleep-30,'Телефон в сторону, свет потише','x','screen');
  A(sleep,'Отбой','x','sleep');
  const res=out.sort((a,b)=>a.m-b.m);res.notes=notes;return res;
}

}

function xpTotal(){let x=0;const g=stepsGoal();
  for(const k in S.log){const l=S.log[k],ex=S.plan.days[parse(k).getDay()]||[];
    x+=Object.keys(l.x||{}).length*10;if(ex.length&&ex.every(e=>l.x[e.id]))x+=30;
    x+=Object.keys(l.m||{}).length*5+Object.keys(l.h||{}).length*5;if(l.w>=S.plan.water)x+=10;
    if(slH(l.sl)!=null)x+=5;if(l.st>=g)x+=10;if(l.r)x+=5}
  x+=Object.keys(S.badges||{}).length*100;
  for(const id in(S.rec||{})){let b=-1;for(const r of S.rec[id]){x+=10;if(r.v>b){if(b>=0)x+=50;b=r.v}}}
  return x}
const need=n=>50*n*(n-1);
function lvl(x){let n=1;while(x>=need(n+1))n++;return{n,cur:x-need(n),span:need(n+1)-need(n),name:n<=LVN.length?LVN[n-1]:LVN[LVN.length-1]+' '+(n-LVN.length+1)}}

const plural=(n,a,b,c)=>{n=Math.abs(n);const m=n%10,h=n%100;return m===1&&h!==11?a:m>=2&&m<=4&&(h<12||h>14)?b:c};

const comma=v=>String(v).replace('.',',');
const hhmm=m=>{m=((Math.round(m)%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};

function bindHold(h,fn){let tmr=null;const start=e=>{e.preventDefault();h.classList.add('go');buzz(8);tmr=setTimeout(()=>{h.classList.add('done');h.querySelector('span').textContent='Готово';fn()},700)};
  const stop=()=>{if(h.classList.contains('done'))return;clearTimeout(tmr);h.classList.remove('go')};
  h.addEventListener('pointerdown',start);['pointerup','pointerleave','pointercancel'].forEach(t=>h.addEventListener(t,stop));
  h.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();h.classList.add('done');fn()}})}

function list(tasks){const f=focusTask(tasks),rest=tasks.filter(x=>x!==f);$('#listBox').hidden=!rest.length;
  $('#list').innerHTML=rest.map(x=>`<div class="it${x.done?' isdone':''}" data-id="${esc(x.id)}"><div class="bgl">${x.done?'↺ Вернуть':'✓ Готово'}</div><div class="fg" tabindex="0"><span class="ico" data-tick="${esc(x.id)}" role="button" aria-label="Отметить: ${esc(x.n)}" style="background:color-mix(in srgb,${x.c} 14%,transparent);color:${x.c}">${x.done?'✓':x.ico}</span><span class="tx"><b>${esc(x.n)}</b><small>${esc(x.s)}</small></span><span class="tm">${x.at!=null?hhmm(x.t):hm(x.t)}</span></div></div>`).join('');
  document.querySelectorAll('#list .it').forEach(it=>bindSwipe(it,tasks))}
function bindSwipe(it,tasks){const fg=it.querySelector('.fg'),x=tasks.find(t=>t.id===it.dataset.id);let x0=null,dx=0,y0=0,lock=null;
  fg.addEventListener('pointerdown',e=>{if(e.target.closest('[data-tick]'))return;x0=e.clientX;y0=e.clientY;dx=0;lock=null;try{fg.setPointerCapture(e.pointerId)}catch(_){}});
  fg.addEventListener('pointermove',e=>{if(x0==null)return;const mx=e.clientX-x0,my=e.clientY-y0;if(lock==null&&(Math.abs(mx)>8||Math.abs(my)>8))lock=Math.abs(mx)>Math.abs(my)?'x':'y';
    if(lock!=='x')return;dx=Math.max(0,mx);fg.classList.add('drag');it.classList.add('sw');fg.style.transform=`translateX(${dx}px)`});
  const end=()=>{if(x0==null)return;fg.classList.remove('drag');const w=fg.offsetWidth;
    if(lock==='x'&&dx>w*.35){fg.style.transform=`translateX(${w}px)`;SND.swipe();setTimeout(()=>complete(x,fg,false),220)}else{fg.style.transform='';setTimeout(()=>it.classList.remove('sw'),350);if(lock==null&&x.kind==='wo'&&!x.done)openWo()}x0=null};
  fg.addEventListener('pointerup',end);fg.addEventListener('pointercancel',end);
  fg.querySelector('[data-tick]').addEventListener('click',e=>{e.stopPropagation();complete(x,fg,false)});
  fg.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();complete(x,fg,false)}})}
function complete(x,el,fromFocus){const was=x.done;toggleTask(x,el);if(!was)shine(el.closest('.now,.it')||el);
  if(fromFocus&&!was&&!RM){const c=$('#now');c.classList.add('cardout');setTimeout(()=>{c.classList.remove('cardout');renderToday(true,x.id)},430)}else renderToday(false,x.id)}

function rFit(r,kc){if(!kc)return'';const f=Math.min(2.5,Math.max(.5,Math.round(kc/r.kcal*4)/4));return `Тебе: ${f===1?'1 порция':comma(f)+' порции'} ≈ ${fmtN(Math.round(r.kcal*f/10)*10)} ккал`}
function mealKcal(type){const n=NUT();if(!n)return null;const sh=mealShares(),m=S.plan.meals.find(e=>RTYPE(e.n)===type);return m?n.kcal*sh[m.id]:null}

/* --- тренировка --- */
let W=null;const RING=628.3;
const mmss=s=>{s=Math.max(0,Math.ceil(s));return s>=60?Math.floor(s/60)+':'+String(s%60).padStart(2,'0'):String(s)};
const clk=ms=>{const s=Math.floor(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const IC={pause:'<svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg>',play:'<svg viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></svg>'};
function woList(){const ex=S.plan.days[parse(cur).getDay()]||[],l=Lr(cur);return ex.map(e=>{const d=pdose(dose(e,cur)),t=tech(e.n)||[];return{e,n:e.n.split(':')[0],pre:d.pre,sets:Math.max(1,d.sets),reps:d.reps,sec:d.sec,note:d.note,tip:t[1]||t[0]||'',done:!!l.x[e.id]}})}
function openWo(e){const EX=woList();if(!EX.length){toast(cur===TODAY()?'Сегодня день отдыха — тренировки нет':'В этот день тренировки не было');SND.tap();return}
  SND.open();const src=e&&e.currentTarget&&e.currentTarget.getBoundingClientRect?e.currentTarget.getBoundingClientRect():$('#fab').getBoundingClientRect();
  const wo=$('#wo');wo.style.setProperty('--cx',(src.left+src.width/2)+'px');wo.style.setProperty('--cy',(src.top+src.height/2)+'px');
  let i=EX.findIndex(x=>!x.done);if(i<0)i=0;
  W={EX,i,set:1,ph:'work',run:false,started:false,end:0,left:0,tot:0,t0:Date.now(),el:0,paused:false,last:-1};
  $('#segs').innerHTML=EX.map(()=>'<i><b></b></i>').join('');wo.classList.add('open');document.body.style.overflow='hidden';buzz(10);
  try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(w=>{if(W)W.lock=w}).catch(()=>{})}catch(_){}
  clearInterval(W.tm);W.tm=setInterval(woTick,100);woDraw()}
function closeWo(){SND.close();$('#wo').classList.remove('open');document.body.style.overflow='';if(W){clearInterval(W.tm);try{W.lock&&W.lock.release()}catch(_){}}W=null;render()}
function startTimer(sec){W.tot=sec*1000;W.end=Date.now()+W.tot;W.left=W.tot;W.run=true;W.started=true;W.last=-1}
function togglePause(){if(!W)return;const n=Date.now();
  if(!W.paused){W.paused=true;W.el+=n-W.t0;if(W.run)W.left=Math.max(0,W.end-n);SND.pause()}else{W.paused=false;W.t0=n;if(W.run)W.end=n+W.left;SND.resume()}buzz(8);woDraw()}
function plus15(){if(!W||!W.run)return;W.tot+=15000;if(W.paused)W.left+=15000;else W.end+=15000;SND.tap();woTick()}
function markEx(x){const l=L(cur);if(!l.x[x.e.id]){l.x[x.e.id]=1;if(woAllDone(cur))stamp(l,'wo',true);touch();checkBadges();checkLevel();persist()}x.done=true}
function nextEx(){W.i++;W.set=1;W.run=false;W.started=false;if(W.i>=W.EX.length){W.ph='done';SND.big();woDraw();return false}return true}
function finishSet(){const x=W.EX[W.i];W.run=false;W.started=false;
  if(W.set<x.sets){W.set++;startRest(REST());return}
  markEx(x);const long=x.sec>=120||x.sets<2;if(!nextEx())return;if(long){W.ph='work';woDraw()}else startRest(Math.round(REST()*.75))}
function startRest(sec){W.ph='rest';startTimer(sec);woDraw()}
function woTick(){if(!W)return;const n=Date.now(),el=W.el+(W.paused?0:n-W.t0),c=$('#woClock');if(c)c.textContent=clk(el);
  if(!W.run||W.paused)return;const left=Math.max(0,W.end-n),sec=Math.ceil(left/1000),rn=$('#rn'),rc=$('#rc');
  if(rn)rn.textContent=mmss(left/1000);if(rc)rc.style.strokeDashoffset=(RING*(1-left/W.tot)).toFixed(1);
  if(sec!==W.last&&sec<=3&&sec>0)SND.count();W.last=sec;
  if(left<=0){W.run=false;SND.beep();buzz([15,30,15]);if(W.ph==='rest'){W.ph='work';W.started=false;woDraw()}else finishSet()}}
function ringHtml(val,color){return `<div class="rest"><svg viewBox="0 0 220 220"><circle cx="110" cy="110" r="100" stroke="#ffffff1a"/><circle id="rc" cx="110" cy="110" r="100" stroke="${color}" stroke-dasharray="${RING}" stroke-dashoffset="${W.run?(RING*(1-(W.paused?W.left:Math.max(0,W.end-Date.now()))/W.tot)).toFixed(1):0}"/></svg><span class="num" id="rn">${val}</span></div>`}
function woDraw(){if(!W)return;const EX=W.EX;
  document.querySelectorAll('#segs i b').forEach((b,j)=>b.style.width=EX[j].done||j<W.i?'100%':j===W.i?Math.round((W.set-1)/Math.max(1,EX[j].sets)*100)+'%':'0');
  $('#woP').innerHTML=W.paused?IC.play:IC.pause;$('#woP').setAttribute('aria-label',W.paused?'Продолжить':'Пауза');$('#wo').classList.toggle('paused',W.paused);
  if(W.ph==='done'){const dn=EX.filter(x=>x.done).length;$('#woStep').textContent='Готово';
    $('#woBody').innerHTML=`<small>Тренировка завершена · ${clk(W.el+(W.paused?0:Date.now()-W.t0))}</small><h2>Как прошло?</h2><p>Сделано ${dn} из ${EX.length}. По оценке подскажу, когда усложнять, а когда повторить неделю.</p>`;
    $('#woActs').innerHTML=`<div class="wrow3">${['Легко','Нормально','Тяжело'].map((t,i)=>`<button class="wbtn" data-rate="${i+1}">${t}</button>`).join('')}</div>`;
    document.querySelectorAll('[data-rate]').forEach(b=>b.onclick=()=>{const r=+b.dataset.rate;L(cur).r=r;touch();checkBadges();checkLevel();persist();const all=woAllDone(cur);closeWo();
      if(all){confetti(cv('--acc'))}const a=advice();toast(a?a.m:['','Отлично! Если так и дальше — пора усложнять.','Хороший темп, так держать.','Ты справился — это главное. Отдыхай.'][r])});return}
  const x=EX[W.i],pp=W.paused?'Продолжить':'Пауза',pic=picHtml(x.e.n);
  $('#woStep').textContent=`${W.i+1}/${EX.length}${x.sets>1?` · подход ${W.set}/${x.sets}`:''}`;
  if(W.ph==='rest'){
    $('#woBody').innerHTML=`<small>${W.paused?'Пауза':'Отдых'}</small>${ringHtml(mmss((W.paused?W.left:W.end-Date.now())/1000),cv('--done'))}<p>Дальше: ${esc(x.n)}${x.pre?' ('+esc(x.pre)+')':''}${x.sets>1?' · подход '+W.set:''}</p>`;
    $('#woActs').innerHTML=`<div class="wrow"><button class="wbtn" id="wPause">${pp}</button><button class="wbtn" id="wPlus">+15 с</button></div><button class="wbtn pri" id="wSkipR">Пропустить отдых</button>`;
    $('#wPause').onclick=togglePause;$('#wPlus').onclick=plus15;$('#wSkipR').onclick=()=>{W.run=false;W.ph='work';W.started=false;SND.tap();woDraw()};return}
  const sub=`<p>${esc([x.pre,x.note].filter(Boolean).join(' · ')||x.tip)}</p>`,skip=`<button class="sec2" id="woSkip">Пропустить</button>`,how=pic||TECH[Object.keys(TECH).find(k=>x.e.n.startsWith(k))]?'<button class="sec2" id="woHow">Как делать</button>':'';
  const bindCommon=()=>{const s=$('#woSkip');if(s)s.onclick=()=>{SND.tap();nextEx()&&woDraw()};const h=$('#woHow');if(h)h.onclick=()=>howSheet(x)};
  if(x.sec){const val=W.started?mmss((W.paused?W.left:W.end-Date.now())/1000):mmss(x.sec);
    $('#woBody').innerHTML=`<small>${W.paused?'Пауза':x.sets>1?'Подход '+W.set:'Начни'}</small><h2>${esc(x.n)}</h2>${ringHtml(val,cv('--acc'))}${sub}`;
    $('#woActs').innerHTML=W.started?`<div class="wrow"><button class="wbtn" id="wPause">${pp}</button><button class="wbtn" id="wPlus">+15 с</button></div><button class="wbtn pri" id="wDone">Готово</button>`
      :`<button class="wbtn pri big" id="wStart">Старт · ${mmss(x.sec)}</button><div class="wrow">${how||''}${skip}</div>`;
    if(W.started){$('#wPause').onclick=togglePause;$('#wPlus').onclick=plus15;$('#wDone').onclick=()=>{click();finishSet()}}
    else{$('#wStart').onclick=()=>{if(W.paused)togglePause();startTimer(x.sec);SND.resume();buzz(10);woDraw()};bindCommon()}return}
  $('#woBody').innerHTML=`<small>${W.paused?'Пауза':x.sets>1?'Подход '+W.set:'Начни'}</small><h2>${esc(x.n)}</h2>${x.reps?`<span class="num big">${x.reps}</span><p>повторов${x.pre?' · '+esc(x.pre):''}${x.note?' · '+esc(x.note):''}</p>`:sub}`;
  $('#woActs').innerHTML=`<button class="hold" id="woHold"><i></i><span>Удерживай — ${x.reps?'сделал':'готово'}</span></button><div class="wrow">${how||''}${skip}</div>`;
  bindHold($('#woHold'),()=>{const r=$('#woHold').getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,0,['#ffffff']);click();if(W.paused)togglePause();setTimeout(finishSet,300)});bindCommon()}
function howSheet(x){const t=tech(x.e.n)||[];openSheet(`<h2>${esc(x.n)}</h2><p>${esc(dose(x.e,cur)||'')}</p>${picHtml(x.e.n)}<ol class="steps">${t.map(s=>`<li>${esc(s)}</li>`).join('')}</ol><button class="close" data-close>Понятно</button>`,1)}

function setSync(m){syncMsg=m;const e=$('#svst');if(e)e.textContent=m}
async function api(p,b){const c=SV();if(!c||!c.url)throw Error('Сервер не указан');
  const r=await fetch(c.url.replace(/\/+$/,'')+p,{method:b?'POST':'GET',headers:{'Authorization':'Bearer '+c.key,'Content-Type':'application/json','ngrok-skip-browser-warning':'1'},body:b?JSON.stringify(b):undefined});
  if(r.status===401)throw Error('неверный ключ');if(!r.ok)throw Error('сервер ответил '+r.status);return r.json()}
function buildRem(){const out=[],t=parse(TODAY());if(!S.prof)return out;const n=NUT(),sh=mealShares();
  for(let dd=0;dd<2;dd++){const d=add(t,dd),k=key(d),base=new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime(),ex=S.plan.days[d.getDay()]||[],at=m=>base+Math.round(m)*60000;
    for(const it of SCHED(k)){
      if(it.kind==='wo'){const ids=ex.map(e=>e.id);
        out.push({id:k+'|wo|pre',at:at(it.m-30),title:'Через 30 минут — '+(ex.length>2?'тренировка':it.n.toLowerCase()),body:ex.map(e=>e.n).slice(0,4).join(', '),chk:{d:k,k:'wo',ids}});
        out.push({id:k+'|wo|late',at:at(it.m+120),title:'Тренировка ещё не отмечена',body:'Сделал — отметь. Нет — ещё не поздно хотя бы на 10 минут.',chk:{d:k,k:'wo',ids}})}
      else if(it.kind==='meal')out.push({id:k+'|m|'+it.id,at:at(it.m),title:it.n+' · '+hm(it.m),body:n?`≈${fmtN(Math.round(n.kcal*sh[it.id]/10)*10)} ккал · ${plate(n,sh[it.id])}`:'Пора поесть — и отметь в приложении',chk:{d:k,k:'m',id:it.id}});
      else if(it.id==='screen')out.push({id:k+'|x|screen',at:at(it.m),title:'Через 30 минут отбой',body:'Телефон в сторону, свет потише.',chk:{d:k,k:'x',id:'screen'}})}
    const p=S.prof;if(p.sleep&&p.wake){let sl=tm(p.sleep);if(sl<=tm(p.wake))sl+=1440;out.push({id:k+'|water',at:at(sl-150),title:'Как с водой?',body:`Норма — ${S.plan.water} стаканов. Отметь, сколько выпил.`,chk:{d:k,k:'w',n:S.plan.water}})}}
  return out.filter(r=>r.at>Date.now()-60000)}
function queueSync(){if(!SV())return;clearTimeout(syncT);syncT=setTimeout(syncNow,1500)}
async function syncNow(){const c=SV();if(!c||!c.url)return;if(syncing){queueSync();return}syncing=true;
  try{if((S.ui||{}).push)S.rem=buildRem();const before=JSON.stringify(S);
    const r=await api('/api/sync',{state:S});
    if(r&&r.state&&r.state.log&&JSON.stringify(S)===before){const after=JSON.stringify(r.state);
      if(after!==before){S=r.state;migrate();if(applyAuto()){persist();queueSync()}else try{localStorage.setItem(LS,after)}catch(e){}render()}}
    if(r){if(r.wx!==undefined)setWx(r.wx);if(r.info){svInfo=r.info;try{localStorage.setItem('forma-info',JSON.stringify(r.info))}catch(e){}}}
    else queueSync();
    setSync('Синхронизировано в '+hm(new Date().getHours()*60+new Date().getMinutes()))}
  catch(e){setSync('Нет связи с сервером: '+e.message+'. Данные сохранены на телефоне.')}
  finally{syncing=false}}
const b64u=s=>{const b=atob((s+'='.repeat((4-s.length%4)%4)).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(b,c=>c.charCodeAt(0))};
async function enablePush(){
  if(!('serviceWorker' in navigator)||!('PushManager' in window)||!('Notification' in window))throw Error('этот браузер не умеет уведомления — открой приложение в Chrome');
  if(await Notification.requestPermission()!=='granted')throw Error('уведомления запрещены — разреши их в настройках Chrome для сайта');
  const{key}=await api('/api/vapid');if(!key)throw Error('на сервере не установлен web-push');
  const reg=await navigator.serviceWorker.ready;let sub=await reg.pushManager.getSubscription();
  if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(key)});
  await api('/api/subscribe',{sub:sub.toJSON()});S.ui=Object.assign({},S.ui,{push:true});persist();await syncNow()}
